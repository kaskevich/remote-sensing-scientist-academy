name: Academy quality checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install geospatial validation dependencies
        run: python -m pip install --requirement requirements-raster-validation.txt --requirement requirements-uav-validation.txt

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security-contract tests
        run: npm test

      - name: Raster training-pack validation
        run: npm run test:raster

      - name: UAV training-pack validation
        run: npm run test:uav

      - name: Browser smoke tests
        run: npm run test:smoke

      - name: Static GitHub Pages build
        run: npm run pages:build
        env:
          PAGES_BASE_PATH: /remote-sensing-scientist-academy
          NEXT_PUBLIC_SITE_URL: https://kaskevich.github.io/remote-sensing-scientist-academy
