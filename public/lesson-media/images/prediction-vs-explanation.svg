<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Description, prediction, explanation and causal inference</title>
  <desc id="desc">Four parallel scientific tasks begin with different questions and require different evidence. A boundary note states that predictive performance does not establish a causal effect.</desc>
  <rect width="1200" height="680" fill="#F6ECE8"/>
  <text x="60" y="62" fill="#0B1930" font-family="Georgia,serif" font-size="34">What scientific job must the model do?</text>
  <text x="60" y="96" fill="#506077" font-family="Arial,sans-serif" font-size="17">Start with the claim, then choose evidence and method</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 140)">
      <rect width="250" height="380" rx="8" fill="#FFFFFF" stroke="#A35F47" stroke-width="3"/>
      <text x="24" y="42" fill="#A35F47" font-size="13" font-weight="700" letter-spacing="2">DESCRIPTION</text>
      <text x="24" y="82" fill="#0B1930" font-size="19" font-weight="700">What was</text>
      <text x="24" y="106" fill="#0B1930" font-size="19" font-weight="700">observed?</text>
      <line x1="24" y1="130" x2="226" y2="130" stroke="#D9C6BE"/>
      <text x="24" y="164" fill="#34485F" font-size="16">Evidence</text>
      <text x="24" y="194" fill="#506077" font-size="14">Defined sample</text>
      <text x="24" y="218" fill="#506077" font-size="14">Counts and distributions</text>
      <text x="24" y="242" fill="#506077" font-size="14">Missingness and coverage</text>
      <text x="24" y="292" fill="#34485F" font-size="16">Output</text>
      <text x="24" y="322" fill="#506077" font-size="14">A bounded summary of</text>
      <text x="24" y="346" fill="#506077" font-size="14">sampled observations</text>
    </g>
    <g transform="translate(336 140)">
      <rect width="250" height="380" rx="8" fill="#FFFFFF" stroke="#A35F47" stroke-width="3"/>
      <text x="24" y="42" fill="#A35F47" font-size="13" font-weight="700" letter-spacing="2">PREDICTION</text>
      <text x="24" y="82" fill="#0B1930" font-size="19" font-weight="700">What will a new</text>
      <text x="24" y="106" fill="#0B1930" font-size="19" font-weight="700">case be?</text>
      <line x1="24" y1="130" x2="226" y2="130" stroke="#D9C6BE"/>
      <text x="24" y="164" fill="#34485F" font-size="16">Evidence</text>
      <text x="24" y="194" fill="#506077" font-size="14">Training observations</text>
      <text x="24" y="218" fill="#506077" font-size="14">Relevant held-out cases</text>
      <text x="24" y="242" fill="#506077" font-size="14">Defined prediction domain</text>
      <text x="24" y="292" fill="#34485F" font-size="16">Output</text>
      <text x="24" y="322" fill="#506077" font-size="14">Target estimate, class</text>
      <text x="24" y="346" fill="#506077" font-size="14">or probability</text>
    </g>
    <g transform="translate(612 140)">
      <rect width="250" height="380" rx="8" fill="#FFFFFF" stroke="#A35F47" stroke-width="3"/>
      <text x="24" y="42" fill="#A35F47" font-size="13" font-weight="700" letter-spacing="2">EXPLANATION</text>
      <text x="24" y="82" fill="#0B1930" font-size="19" font-weight="700">How are variables</text>
      <text x="24" y="106" fill="#0B1930" font-size="19" font-weight="700">related?</text>
      <line x1="24" y1="130" x2="226" y2="130" stroke="#D9C6BE"/>
      <text x="24" y="164" fill="#34485F" font-size="16">Evidence</text>
      <text x="24" y="194" fill="#506077" font-size="14">Model and assumptions</text>
      <text x="24" y="218" fill="#506077" font-size="14">Association structure</text>
      <text x="24" y="242" fill="#506077" font-size="14">Alternative explanations</text>
      <text x="24" y="292" fill="#34485F" font-size="16">Output</text>
      <text x="24" y="322" fill="#506077" font-size="14">A relationship interpreted</text>
      <text x="24" y="346" fill="#506077" font-size="14">under stated assumptions</text>
    </g>
    <g transform="translate(888 140)">
      <rect width="250" height="380" rx="8" fill="#FFFFFF" stroke="#A35F47" stroke-width="3"/>
      <text x="24" y="42" fill="#A35F47" font-size="13" font-weight="700" letter-spacing="2">CAUSAL INFERENCE</text>
      <text x="24" y="82" fill="#0B1930" font-size="19" font-weight="700">What if we</text>
      <text x="24" y="106" fill="#0B1930" font-size="19" font-weight="700">intervene?</text>
      <line x1="24" y1="130" x2="226" y2="130" stroke="#D9C6BE"/>
      <text x="24" y="164" fill="#34485F" font-size="16">Evidence</text>
      <text x="24" y="194" fill="#506077" font-size="14">Defined contrast</text>
      <text x="24" y="218" fill="#506077" font-size="14">Causal design and assumptions</text>
      <text x="24" y="242" fill="#506077" font-size="14">Confounding assessment</text>
      <text x="24" y="292" fill="#34485F" font-size="16">Output</text>
      <text x="24" y="322" fill="#506077" font-size="14">An intervention effect</text>
      <text x="24" y="346" fill="#506077" font-size="14">under explicit conditions</text>
    </g>
  </g>
  <rect x="60" y="558" width="1078" height="76" rx="8" fill="#0B1930"/>
  <text x="599" y="592" text-anchor="middle" fill="#F6ECE8" font-family="Arial,sans-serif" font-size="18" font-weight="700">A model can predict well without identifying a cause</text>
  <text x="599" y="619" text-anchor="middle" fill="#D7DEE7" font-family="Arial,sans-serif" font-size="15">Match the wording, evidence and validation to the scientific job</text>
</svg>
