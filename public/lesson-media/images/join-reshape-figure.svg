<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Join, reshape and figure workflow</title><desc id="desc">Two one-row-per-site summaries join on a validated site key, the evidence is reshaped into a site-by-community matrix, and a labelled chart communicates one comparison.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 16px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">STRUCTURE · PRESERVE ENTITY MEANING</text><text x="60" y="98" class="h">Validated join to comparison matrix to figure</text>
  <g transform="translate(60 170)"><rect width="240" height="110" rx="9" fill="#142c43" stroke="#4c91c8"/><text x="120" y="40" text-anchor="middle" class="t">RICHNESS BY SITE</text><text x="120" y="74" text-anchor="middle" class="s">one site · one row</text><rect y="150" width="240" height="110" rx="9" fill="#142c43" stroke="#4c91c8"/><text x="120" y="190" text-anchor="middle" class="t">AGB COVERAGE BY SITE</text><text x="120" y="224" text-anchor="middle" class="s">one site · one row</text></g>
  <line x1="300" y1="280" x2="430" y2="280" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><text x="365" y="255" text-anchor="middle" class="s">site · one_to_one</text>
  <g transform="translate(440 205)"><rect width="240" height="170" rx="9" fill="#183d38" stroke="#c8f33d"/><text x="120" y="42" text-anchor="middle" class="t">JOINED REPORT</text><text x="30" y="84" class="s">✓ 4 rows</text><text x="30" y="116" class="s">✓ no duplicate keys</text><text x="30" y="148" class="s">✓ no unmatched sites</text></g>
  <line x1="680" y1="290" x2="770" y2="290" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(780 190)"><rect width="160" height="200" rx="9" fill="#10253a" stroke="#4c91c8"/><text x="80" y="35" text-anchor="middle" class="t">MATRIX</text><path d="M20 60h120M20 95h120M20 130h120M20 165h120M55 60v120M95 60v120" stroke="#4c91c8"/><rect x="55" y="95" width="40" height="35" fill="#f39a4a" opacity=".8"/><text x="80" y="192" text-anchor="middle" class="s">NaN = unsampled</text></g>
  <line x1="940" y1="290" x2="1010" y2="290" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(1020 190)"><rect width="130" height="200" rx="9" fill="#10253a" stroke="#4c91c8"/><text x="65" y="35" text-anchor="middle" class="t">FIGURE</text><line x1="25" y1="165" x2="110" y2="165" stroke="#9fb2c4"/><rect x="35" y="105" width="18" height="60" fill="#4c91c8"/><rect x="61" y="75" width="18" height="90" fill="#4c91c8"/><rect x="87" y="120" width="18" height="45" fill="#4c91c8"/></g>
  <text x="60" y="540" class="s">The figure is the final view, not the complete evidence. Keep source rows, counts, keys and captions traceable.</text>
</svg>
