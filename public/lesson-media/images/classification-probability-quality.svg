<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Classification decisions, score ranking and probability calibration need different evidence</title>
  <desc id="desc">Three panels show a fixed-threshold confusion matrix, ROC and precision-recall ranking curves, and a reliability diagram whose observations fall below the ideal diagonal, indicating overconfident probability estimates despite useful ranking.</desc>
  <rect width="1200" height="700" fill="#FBF7F4"/>
  <style>.h{font:700 29px Georgia,serif;fill:#13263D}.s{font:700 17px Arial,sans-serif;fill:#13263D}.b{font:15px Arial,sans-serif;fill:#30465C}.t{font:13px Arial,sans-serif;fill:#52687D}.box{fill:#fff;stroke:#D9C7BD;stroke-width:2}.axis{stroke:#637487;stroke-width:2}.clay{fill:#A35F47}.blue{fill:#6B86A0}.line{fill:none;stroke:#A35F47;stroke-width:4}.ref{stroke:#637487;stroke-width:2;stroke-dasharray:6 5}</style>
  <text x="55" y="58" class="h">One classifier produces three evidence questions</text>
  <g transform="translate(55 100)"><rect width="330" height="455" rx="15" class="box"/><text x="24" y="38" class="s">1 · Fixed decision</text><text x="24" y="64" class="b">What happens at the frozen threshold?</text><text x="72" y="110" class="t">Reference +</text><text x="205" y="110" class="t">Reference −</text><rect x="55" y="130" width="110" height="95" rx="8" fill="#E8F1EB"/><rect x="175" y="130" width="110" height="95" rx="8" fill="#F6ECE8"/><rect x="55" y="235" width="110" height="95" rx="8" fill="#F6ECE8"/><rect x="175" y="235" width="110" height="95" rx="8" fill="#E8F1EB"/><text x="88" y="172" class="s">TP 12</text><text x="203" y="172" class="s">FP 9</text><text x="88" y="278" class="s">FN 3</text><text x="203" y="278" class="s">TN 76</text><text x="70" y="355" class="t">Predicted +</text><text x="70" y="385" class="t">Predicted −</text><text x="24" y="425" class="b">Counts · workload · consequences</text></g>
  <g transform="translate(435 100)"><rect width="330" height="455" rx="15" class="box"/><text x="24" y="38" class="s">2 · Score ranking</text><text x="24" y="64" class="b">Can positives rank above negatives?</text><line x1="62" y1="330" x2="285" y2="330" class="axis"/><line x1="62" y1="120" x2="62" y2="330" class="axis"/><line x1="62" y1="330" x2="285" y2="120" class="ref"/><path d="M62 330 C85 210 140 155 285 120" class="line"/><text x="84" y="148" class="t">ROC</text><line x1="62" y1="410" x2="285" y2="410" class="axis"/><path d="M62 380 C118 280 205 300 285 250" class="line"/><line x1="62" y1="390" x2="285" y2="390" class="ref"/><text x="84" y="270" class="t">Precision–recall</text><text x="24" y="425" class="b">Many thresholds · no probability meaning</text></g>
  <g transform="translate(815 100)"><rect width="330" height="455" rx="15" class="box"/><text x="24" y="38" class="s">3 · Probability quality</text><text x="24" y="64" class="b">Does 0.7 behave like 70%?</text><line x1="62" y1="330" x2="285" y2="330" class="axis"/><line x1="62" y1="120" x2="62" y2="330" class="axis"/><line x1="62" y1="330" x2="285" y2="120" class="ref"/><polyline points="82,315 125,292 170,265 215,220 265,178" class="line"/><g class="clay"><circle cx="82" cy="315" r="6"/><circle cx="125" cy="292" r="6"/><circle cx="170" cy="265" r="6"/><circle cx="215" cy="220" r="6"/><circle cx="265" cy="178" r="6"/></g><text x="95" y="152" class="t">below diagonal:</text><text x="95" y="172" class="t">probabilities overconfident</text><text x="105" y="355" class="t">Mean predicted probability</text><text x="28" y="290" class="t" transform="rotate(-90 28 290)">Observed frequency</text><text x="24" y="425" class="b">Reliability · Brier · bin counts</text></g>
  <rect x="55" y="590" width="1090" height="72" rx="12" fill="#13263D"/><text x="82" y="620" font-family="Arial" font-size="16" font-weight="700" fill="#fff">A useful ranking can still be poorly calibrated</text><text x="82" y="645" font-family="Arial" font-size="15" fill="#fff">Report the fixed operating point, prevalence, class counts, ranking curves and reliability evidence separately</text>
</svg>
