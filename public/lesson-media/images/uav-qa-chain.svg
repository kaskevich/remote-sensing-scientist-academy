<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">UAV quality assurance chain</title><desc id="desc">Mission, image, photogrammetry, georeferencing, orthomosaic, DSM, multispectral and temporal checks converge on an accept, review or unsuitable decision.</desc>
  <style>.b{fill:#eef5ff;stroke:#1261a6;stroke-width:2}.n{fill:#f7f9fc;stroke:#6b7787;stroke-width:2}.t{font:600 15px system-ui;fill:#10233f}.s{font:13px system-ui;fill:#33445c}.a{stroke:#1261a6;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#1261a6"/></marker></defs>
  <g transform="translate(30 40)"><rect class="b" width="190" height="60" rx="9"/><text class="t" x="65" y="36">Mission QA</text><rect class="b" y="80" width="190" height="60" rx="9"/><text class="t" x="66" y="116">Image QA</text><rect class="b" y="160" width="190" height="60" rx="9"/><text class="t" x="35" y="196">Photogrammetry QA</text><rect class="b" y="240" width="190" height="60" rx="9"/><text class="t" x="38" y="276">Georeferencing QA</text></g>
  <g transform="translate(280 40)"><rect class="n" width="190" height="60" rx="9"/><text class="t" x="46" y="36">Orthomosaic QA</text><rect class="n" y="80" width="190" height="60" rx="9"/><text class="t" x="70" y="116">DSM QA</text><rect class="n" y="160" width="190" height="60" rx="9"/><text class="t" x="45" y="196">Multispectral QA</text><rect class="n" y="240" width="190" height="60" rx="9"/><text class="t" x="58" y="276">Temporal QA</text></g>
  <path class="a" d="M220 70H280M220 150H280M220 230H280M220 310H280"/><path class="a" d="M470 70L610 185M470 150L610 195M470 230L610 205M470 310L610 215"/>
  <rect class="b" x="610" y="135" width="330" height="150" rx="12"/><text class="t" x="675" y="175">Fitness-for-purpose decision</text><text class="s" x="655" y="208">ACCEPT · REVIEW · UNSUITABLE</text><text class="s" x="655" y="238">evidence + consequence + action</text><text class="s" x="655" y="263">not colour alone and not appearance alone</text>
  <text class="s" x="55" y="385">A product can pass one QA category and fail another; temporal or scientific mismatch can override technical quality.</text>
</svg>
