<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Training and development loss patterns for underfitting, controlled learning and overfitting</title>
  <desc id="desc">Three panels compare training MAE and structured-development MAE across boosting rounds. Underfit curves remain high, controlled curves reach a shared plateau, and overfit curves diverge after the development minimum.</desc>
  <rect width="1200" height="680" fill="#FBF7F4"/>
  <style>.h{font:700 30px Georgia,serif;fill:#13263D}.s{font:700 19px Arial,sans-serif;fill:#13263D}.b{font:15px Arial,sans-serif;fill:#30465C}.axis{stroke:#637487;stroke-width:2}.train{stroke:#13263D;stroke-width:5;fill:none}.valid{stroke:#A35F47;stroke-width:5;fill:none}.stop{stroke:#B97358;stroke-width:3;stroke-dasharray:8 7}.panel{fill:#fff;stroke:#D9C7BD;stroke-width:2}</style>
  <text x="55" y="52" class="h">Learning dynamics require two evidence streams</text>
  <line x1="630" y1="82" x2="675" y2="82" class="train"/><text x="687" y="88" class="b">inner training MAE</text><line x1="865" y1="82" x2="910" y2="82" class="valid"/><text x="922" y="88" class="b">structured-development MAE</text>
  <g transform="translate(45 120)"><rect width="340" height="455" rx="15" class="panel"/><text x="24" y="39" class="s">Underfit</text><text x="24" y="64" class="b">Both errors stay high</text><line x1="55" y1="385" x2="310" y2="385" class="axis"/><line x1="55" y1="100" x2="55" y2="385" class="axis"/><text x="120" y="423" class="b">boosting rounds</text><text x="18" y="255" class="b" transform="rotate(-90 18 255)">MAE</text><path d="M65 170 C120 190 190 205 300 218" class="train"/><path d="M65 145 C135 160 210 174 300 181" class="valid"/><text x="77" y="285" class="b">Limited capacity, weak</text><text x="77" y="307" class="b">predictors or strong noise</text><text x="77" y="338" class="b">Small gap ≠ useful fit</text></g>
  <g transform="translate(430 120)"><rect width="340" height="455" rx="15" class="panel"/><text x="24" y="39" class="s">Controlled learning</text><text x="24" y="64" class="b">Development minimum is stable</text><line x1="55" y1="385" x2="310" y2="385" class="axis"/><line x1="55" y1="100" x2="55" y2="385" class="axis"/><text x="120" y="423" class="b">boosting rounds</text><path d="M65 145 C120 205 200 260 300 285" class="train"/><path d="M65 132 C125 190 190 225 230 230 C260 231 280 229 300 232" class="valid"/><line x1="232" y1="90" x2="232" y2="385" class="stop"/><text x="184" y="108" class="b">best iteration</text><text x="82" y="326" class="b">Broad development plateau</text><text x="82" y="348" class="b">with proportionate gap</text></g>
  <g transform="translate(815 120)"><rect width="340" height="455" rx="15" class="panel"/><text x="24" y="39" class="s">Overfit</text><text x="24" y="64" class="b">Training improves after transfer worsens</text><line x1="55" y1="385" x2="310" y2="385" class="axis"/><line x1="55" y1="100" x2="55" y2="385" class="axis"/><text x="120" y="423" class="b">boosting rounds</text><path d="M65 145 C125 215 200 290 300 340" class="train"/><path d="M65 134 C115 190 165 215 205 207 C245 190 275 160 300 135" class="valid"/><line x1="185" y1="90" x2="185" y2="385" class="stop"/><text x="137" y="108" class="b">best iteration</text><text x="81" y="300" class="b">Widening gap: later trees</text><text x="81" y="322" class="b">fit training-specific detail</text></g>
  <text x="55" y="640" class="b">The stopping marker is selected from development evidence inside the outer fold. Outer assessment must not steer the curve.</text>
</svg>
