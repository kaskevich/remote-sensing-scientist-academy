<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc">
  <title id="title">Controlled hyperparameter search inside two evidence firewalls</title>
  <desc id="desc">A frozen protocol passes into grouped inner selection. A first evidence firewall protects outer site assessment from selection, and a second firewall keeps the final test sealed.</desc>
  <rect width="1400" height="740" fill="#FBF7F4"/>
  <style>
    .heading{font:700 31px Georgia,serif;fill:#13263D}
    .stage{font:700 18px Arial,sans-serif;fill:#13263D}
    .body{font:16px Arial,sans-serif;fill:#30465C}
    .small{font:14px Arial,sans-serif;fill:#30465C}
    .micro{font:700 11px Arial,sans-serif;fill:#A35F47;letter-spacing:1.4px}
    .box{fill:#fff;stroke:#A35F47;stroke-width:3}
    .soft{fill:#F6ECE8;stroke:#B97358;stroke-width:2}
    .flow{stroke:#A35F47;stroke-width:4;fill:none}
    .firewall{stroke:#A35F47;stroke-width:5;stroke-dasharray:12 10}
  </style>

  <text x="58" y="60" class="heading">Controlled search is a procedure inside protected evidence</text>
  <text x="58" y="91" class="small">Each decision is made with a declared evidence role; no later target may leak backwards</text>

  <rect x="50" y="135" width="260" height="430" rx="16" class="box"/>
  <text x="78" y="175" class="stage">1 · Frozen protocol</text>
  <rect x="78" y="205" width="204" height="62" rx="9" class="soft"/>
  <text x="96" y="232" class="body">Primary metric</text>
  <text x="96" y="254" class="small">MAE in target units</text>
  <rect x="78" y="283" width="204" height="78" rx="9" class="soft"/>
  <text x="96" y="311" class="body">Bounded space</text>
  <text x="96" y="334" class="small">Depth · rate · child evidence</text>
  <text x="96" y="353" class="small">Subsample · colsample</text>
  <rect x="78" y="377" width="204" height="62" rx="9" class="soft"/>
  <text x="96" y="404" class="body">Budget and seed</text>
  <text x="96" y="426" class="small">12 candidates · seed 42</text>
  <rect x="78" y="455" width="204" height="82" rx="9" class="soft"/>
  <text x="96" y="482" class="body">Evidence rule</text>
  <text x="96" y="505" class="small">Select inside grouped</text>
  <text x="96" y="525" class="small">development folds only</text>

  <path d="M310 350H365" class="flow"/>
  <path d="M354 338l18 12-18 12" fill="#A35F47"/>

  <rect x="375" y="135" width="340" height="430" rx="16" class="box"/>
  <text x="403" y="175" class="stage">2 · Inner grouped selection</text>
  <text x="403" y="202" class="small">Use the current outer-development partition only</text>
  <rect x="410" y="229" width="270" height="88" rx="10" class="soft"/>
  <text x="435" y="257" class="body">Fold A</text>
  <text x="435" y="280" class="small">Train blocks → validate block</text>
  <text x="435" y="301" class="small">Score every declared candidate</text>
  <rect x="410" y="335" width="270" height="88" rx="10" class="soft"/>
  <text x="435" y="363" class="body">Fold B</text>
  <text x="435" y="386" class="small">Train blocks → validate block</text>
  <text x="435" y="407" class="small">Preserve the complete result table</text>
  <rect x="410" y="441" width="270" height="96" rx="10" fill="#A35F47"/>
  <text x="435" y="472" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Selection rule</text>
  <text x="435" y="498" font-family="Arial" font-size="15" fill="#fff">Choose by the declared metric</text>
  <text x="435" y="521" font-family="Arial" font-size="15" fill="#fff">Refit on outer development</text>

  <text x="765" y="120" text-anchor="middle" class="micro">FIREWALL 1</text>
  <line x1="765" y1="135" x2="765" y2="565" class="firewall"/>
  <path d="M715 350H815" class="flow"/>
  <path d="M804 338l18 12-18 12" fill="#A35F47"/>
  <rect x="720" y="579" width="90" height="42" rx="7" fill="#F6ECE8" stroke="#B97358"/>
  <text x="765" y="596" text-anchor="middle" class="micro">NO OUTER</text>
  <text x="765" y="611" text-anchor="middle" class="micro">SELECTION</text>

  <rect x="825" y="195" width="245" height="310" rx="16" class="box"/>
  <text x="855" y="237" class="stage">3 · Outer site</text>
  <text x="855" y="260" class="stage">assessment</text>
  <text x="855" y="305" class="body">Predict once with the</text>
  <text x="855" y="328" class="body">selected procedure</text>
  <line x1="855" y1="354" x2="1040" y2="354" stroke="#D9C6BE"/>
  <text x="855" y="389" class="small">Save row predictions</text>
  <text x="855" y="413" class="small">Report every site fold</text>
  <text x="855" y="437" class="small">Do not tune here</text>
  <text x="855" y="461" class="small">Do not revise features</text>

  <text x="1120" y="120" text-anchor="middle" class="micro">FIREWALL 2</text>
  <line x1="1120" y1="135" x2="1120" y2="565" class="firewall"/>
  <path d="M1070 350H1170" class="flow"/>
  <path d="M1159 338l18 12-18 12" fill="#A35F47"/>
  <rect x="1065" y="579" width="110" height="42" rx="7" fill="#F6ECE8" stroke="#B97358"/>
  <text x="1120" y="596" text-anchor="middle" class="micro">FINAL TEST</text>
  <text x="1120" y="611" text-anchor="middle" class="micro">STAYS SEALED</text>

  <rect x="1180" y="235" width="165" height="230" rx="16" fill="#13263D"/>
  <text x="1262" y="278" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">4 · Final test</text>
  <line x1="1206" y1="303" x2="1319" y2="303" stroke="#56677B"/>
  <text x="1262" y="337" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">No tuning</text>
  <text x="1262" y="365" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">No stopping</text>
  <text x="1262" y="393" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">No features</text>
  <text x="1262" y="421" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">No thresholds</text>

  <rect x="50" y="650" width="1295" height="48" rx="8" fill="#13263D"/>
  <text x="697" y="680" text-anchor="middle" font-family="Arial" font-size="16" fill="#F6ECE8">The outer score evaluates the complete search rule—not the inner winning score—and every outer fold repeats the procedure</text>
</svg>
