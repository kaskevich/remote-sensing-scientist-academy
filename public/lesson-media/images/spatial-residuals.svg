<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Similar pooled error can conceal different residual geography</title>
  <desc id="desc">Two simplified coastal-meadow maps have similar average error. Site A has small mixed residuals, while Site B has a coherent coastal band of underprediction. A subgroup table shows how pooled bias cancels opposing habitat-specific errors.</desc>
  <rect width="1200" height="700" fill="#FBF7F4"/>
  <style>.h{font:700 29px Georgia,serif;fill:#13263D}.s{font:700 17px Arial,sans-serif;fill:#13263D}.b{font:15px Arial,sans-serif;fill:#30465C}.t{font:13px Arial,sans-serif;fill:#52687D}.box{fill:#fff;stroke:#D9C7BD;stroke-width:2}.coast{fill:#E8F1EB;stroke:#6B86A0;stroke-width:2}.under{fill:#A35F47}.over{fill:#44739E}.zero{fill:#E2DCD7}</style>
  <text x="55" y="58" class="h">Ask where the fixed model fails</text>
  <g transform="translate(55 100)"><rect width="430" height="430" rx="15" class="box"/><text x="24" y="38" class="s">Site A · small mixed residuals</text><path d="M45 95 Q170 55 380 110 L390 350 Q215 390 55 335 Z" class="coast"/><path d="M45 290 Q185 255 390 285 L390 350 Q215 390 55 335 Z" fill="#D6E8F1"/><g><circle cx="115" cy="145" r="11" class="over"/><circle cx="190" cy="125" r="8" class="under"/><circle cx="275" cy="160" r="9" class="zero"/><circle cx="345" cy="205" r="10" class="over"/><circle cx="125" cy="245" r="9" class="under"/><circle cx="220" cy="225" r="10" class="over"/><circle cx="315" cy="270" r="9" class="under"/><circle cx="210" cy="320" r="8" class="zero"/></g><text x="24" y="405" class="b">MAE 4.6 cm · bias +0.2 cm</text></g>
  <g transform="translate(515 100)"><rect width="430" height="430" rx="15" class="box"/><text x="24" y="38" class="s">Site B · structured coastal failure</text><path d="M45 95 Q170 55 380 110 L390 350 Q215 390 55 335 Z" class="coast"/><path d="M45 290 Q185 255 390 285 L390 350 Q215 390 55 335 Z" fill="#D6E8F1"/><g><circle cx="115" cy="145" r="8" class="over"/><circle cx="190" cy="125" r="8" class="over"/><circle cx="275" cy="160" r="8" class="zero"/><circle cx="345" cy="205" r="8" class="over"/><circle cx="105" cy="292" r="13" class="under"/><circle cx="185" cy="310" r="15" class="under"/><circle cx="275" cy="305" r="14" class="under"/><circle cx="350" cy="320" r="16" class="under"/></g><text x="24" y="405" class="b">MAE 4.7 cm · bias −2.8 cm</text></g>
  <g transform="translate(975 100)"><rect width="170" height="430" rx="15" class="box"/><text x="18" y="38" class="s">Direction</text><circle cx="35" cy="82" r="11" class="over"/><text x="55" y="88" class="t">overpredict</text><circle cx="35" cy="122" r="11" class="under"/><text x="55" y="128" class="t">underpredict</text><circle cx="35" cy="162" r="11" class="zero"/><text x="55" y="168" class="t">near zero</text><line x1="18" y1="195" x2="150" y2="195" stroke="#D9C7BD"/><text x="18" y="230" class="s">Subgroups</text><text x="18" y="266" class="t">wet · bias −6.1</text><text x="18" y="294" class="t">dry · bias +4.9</text><text x="18" y="333" class="t">pooled bias can</text><text x="18" y="353" class="t">hide cancellation</text><text x="18" y="395" class="t">Report rows + sites</text></g>
  <rect x="55" y="575" width="1090" height="78" rx="12" fill="#13263D"/><text x="82" y="606" font-family="Arial" font-size="16" font-weight="700" fill="#fff">A spatial pattern supports a failure hypothesis, not its mechanism</text><text x="82" y="633" font-family="Arial" font-size="15" fill="#fff">Audit joins, target support, acquisition QA and independent group counts before changing the model</text>
</svg>
