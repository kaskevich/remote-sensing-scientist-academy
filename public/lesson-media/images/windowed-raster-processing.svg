<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Windowed raster processing workflow</title>
  <desc id="desc">A large tiled raster is processed block by block through read, calculate, write and equivalence checks without accumulating all blocks in memory.</desc>
  <rect width="1200" height="650" rx="28" fill="#f5f7f4"/>
  <text x="60" y="64" fill="#0b1f35" font-family="Arial, sans-serif" font-size="30" font-weight="700">Process one block, release it, continue</text>
  <text x="60" y="98" fill="#526272" font-family="Arial, sans-serif" font-size="17">Windowing controls memory; algorithm support and equivalence still require validation</text>
  <g transform="translate(65 145)" font-family="Arial, sans-serif">
    <rect width="330" height="350" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-size="18" font-weight="700">TILED SOURCE</text>
    <g transform="translate(55 72)" fill="#e8f2fa" stroke="#438dc2" stroke-width="2"><rect width="220" height="220"/><path d="M55 0V220M110 0V220M165 0V220M0 55H220M0 110H220M0 165H220"/><rect x="55" y="110" width="55" height="55" fill="#f28c28"/></g>
    <text x="24" y="325" fill="#526272" font-size="15">block_windows() follows stored chunks</text>
  </g>
  <g transform="translate(440 185)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect width="320" height="270" rx="18" fill="#0b1f35"/>
    <text x="160" y="44" fill="#fff" font-size="18" font-weight="700">ONE ITERATION</text>
    <rect x="45" y="68" width="230" height="38" rx="10" fill="#dcecf7"/><text x="160" y="93" fill="#0b1f35" font-size="16">read(window, masked=True)</text>
    <path d="M160 106V124" stroke="#8cc3e8" stroke-width="3"/>
    <rect x="45" y="124" width="230" height="38" rx="10" fill="#dcecf7"/><text x="160" y="149" fill="#0b1f35" font-size="16">calculate with mask</text>
    <path d="M160 162V180" stroke="#8cc3e8" stroke-width="3"/>
    <rect x="45" y="180" width="230" height="38" rx="10" fill="#dcecf7"/><text x="160" y="205" fill="#0b1f35" font-size="16">write same window</text>
    <text x="160" y="248" fill="#fff" font-size="15">do not accumulate every block</text>
  </g>
  <g transform="translate(805 145)" font-family="Arial, sans-serif">
    <rect width="330" height="350" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-size="18" font-weight="700">VERIFY OUTPUT</text>
    <g font-size="16" fill="#0b1f35"><text x="34" y="90">□ CRS and transform</text><text x="34" y="128">□ shape and NoData</text><text x="34" y="166">□ valid-cell count</text><text x="34" y="204">□ summary statistics</text><text x="34" y="242">□ representative pixels</text><text x="34" y="280">□ full-read equivalence</text></g>
    <text x="24" y="325" fill="#526272" font-size="15">Use halos for neighbourhood operations</text>
  </g>
  <rect x="186" y="550" width="828" height="54" rx="18" fill="#0b1f35"/>
  <text x="600" y="584" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">bytes = width × height × bands × bytes per value — before masks and temporary arrays</text>
</svg>
