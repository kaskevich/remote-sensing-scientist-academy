<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Georeferencing evidence from GNSS, RTK, PPK, control and check points</title><desc id="desc">Four positioning paths feed a reconstruction while independent check points remain outside fitting and test absolute horizontal and vertical accuracy.</desc>
  <style>.b{fill:#eef5ff;stroke:#1261a6;stroke-width:2}.n{fill:#f7f9fc;stroke:#6b7787;stroke-width:2}.c{fill:#dff25f;stroke:#536500;stroke-width:2}.t{font:600 16px system-ui;fill:#10233f}.s{font:13px system-ui;fill:#33445c}.a{stroke:#1261a6;stroke-width:3;fill:none;marker-end:url(#m)}.d{stroke:#536500;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#g)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#1261a6"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#536500"/></marker></defs>
  <rect class="n" x="35" y="45" width="180" height="60" rx="9"/><text class="t" x="65" y="80">Onboard GNSS</text><rect class="n" x="35" y="125" width="180" height="60" rx="9"/><text class="t" x="90" y="160">RTK</text><rect class="n" x="35" y="205" width="180" height="60" rx="9"/><text class="t" x="90" y="240">PPK</text><rect class="n" x="35" y="285" width="180" height="60" rx="9"/><text class="t" x="62" y="320">Ground control</text>
  <path class="a" d="M215 75L390 170M215 155L390 185M215 235L390 200M215 315L390 215"/><rect class="b" x="390" y="135" width="235" height="120" rx="12"/><text class="t" x="428" y="175">Fitted reconstruction</text><text class="s" x="418" y="207">relative consistency +</text><text class="s" x="418" y="231">external reference constraints</text>
  <rect class="c" x="710" y="55" width="210" height="90" rx="12"/><text class="t" x="747" y="92">Withheld checks</text><text class="s" x="734" y="120">not used in fitting</text><path class="d" d="M815 145V235"/><rect class="c" x="690" y="235" width="250" height="110" rx="12"/><text class="t" x="725" y="272">Independent assessment</text><text class="s" x="715" y="300">bias, RMSE, outliers, pattern</text><text class="s" x="715" y="325">horizontal and vertical</text>
</svg>
