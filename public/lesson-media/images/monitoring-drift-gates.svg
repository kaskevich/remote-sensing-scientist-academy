<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Repeated prediction monitoring and drift gates</title><desc id="desc">New imagery moves through acquisition quality, frozen predictors, schema and applicability gates, repeated prediction and uncertainty, then comparison and scientific review. Separate lower lanes distinguish data quality change, covariate shift, concept drift and ecological change.</desc>
  <rect width="1200" height="700" fill="#FBF8F5"/><text x="55" y="58" font-family="Georgia,serif" font-size="31" fill="#14263D">Repeated predictions require comparability before interpretation</text>
  <g font-family="Arial,sans-serif"><g fill="#FFFFFF" stroke="#A35F47" stroke-width="3"><rect x="45" y="120" width="165" height="90" rx="10"/><rect x="245" y="120" width="165" height="90" rx="10"/><rect x="445" y="120" width="165" height="90" rx="10"/><rect x="645" y="120" width="165" height="90" rx="10"/><rect x="845" y="120" width="165" height="90" rx="10"/><rect x="1045" y="120" width="120" height="90" rx="10"/></g>
  <g fill="#14263D" text-anchor="middle"><text x="128" y="155" font-size="17" font-weight="700">Imagery QA</text><text x="128" y="181" font-size="14">source · cloud · date</text><text x="328" y="155" font-size="17" font-weight="700">Frozen features</text><text x="328" y="181" font-size="14">same meaning</text><text x="528" y="155" font-size="17" font-weight="700">Domain gate</text><text x="528" y="181" font-size="14">schema · support</text><text x="728" y="155" font-size="17" font-weight="700">Prediction</text><text x="728" y="181" font-size="14">uncertainty · release</text><text x="928" y="155" font-size="17" font-weight="700">Comparison</text><text x="928" y="181" font-size="14">reference run</text><text x="1105" y="155" font-size="17" font-weight="700">Review</text><text x="1105" y="181" font-size="14">verify · act</text></g>
  <g stroke="#A35F47" stroke-width="4" fill="none"><path d="M210 165h27"/><path d="M410 165h27"/><path d="M610 165h27"/><path d="M810 165h27"/><path d="M1010 165h27"/></g><g fill="#A35F47"><path d="M237 165l-12-7v14z"/><path d="M437 165l-12-7v14z"/><path d="M637 165l-12-7v14z"/><path d="M837 165l-12-7v14z"/><path d="M1037 165l-12-7v14z"/></g>
  <text x="55" y="290" font-family="Georgia,serif" font-size="24" fill="#14263D">Do not collapse four different diagnoses</text>
  <g><rect x="55" y="325" width="1090" height="62" rx="9" fill="#E9EFF3"/><rect x="55" y="399" width="1090" height="62" rx="9" fill="#F4E4DD"/><rect x="55" y="473" width="1090" height="62" rx="9" fill="#F7EAC9"/><rect x="55" y="547" width="1090" height="62" rx="9" fill="#E7F0E2"/></g>
  <g fill="#14263D"><text x="80" y="363" font-size="17" font-weight="700">Data-quality change</text><text x="330" y="363" font-size="16">measurement process, masks, geolocation or processing baseline changed</text><text x="80" y="437" font-size="17" font-weight="700">Covariate shift</text><text x="330" y="437" font-size="16">predictor distribution or represented domain changed</text><text x="80" y="511" font-size="17" font-weight="700">Concept drift</text><text x="330" y="511" font-size="16">predictor–target relationship changed; new paired targets are required</text><text x="80" y="585" font-size="17" font-weight="700">Ecological change</text><text x="330" y="585" font-size="16">environmental quantity changed; predicted difference still needs verification</text></g>
  <rect x="285" y="640" width="630" height="38" rx="19" fill="#14263D"/><text x="600" y="665" text-anchor="middle" font-size="16" fill="#FFFFFF">release · investigate · withhold · retrain · retire</text></g>
</svg>
