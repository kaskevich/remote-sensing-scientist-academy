<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Loop and vectorised views of repeated analysis</title><desc id="desc">A loop visits SALS1, SALS2 and SALS3 one record at a time. Vectorised thinking treats their richness values as one array and applies a comparison to all positions.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 18px Inter,Arial}.s{fill:#9fb2c4;font:400 15px Inter,Arial}.c{fill:#071426;font:700 18px ui-monospace,monospace}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">REPETITION · SAME METHOD, DIFFERENT SCALE</text><text x="60" y="98" class="h">See the iteration before compressing it</text>
  <text x="80" y="155" class="t">Loop: one current record</text>
  <g transform="translate(80 185)"><rect width="360" height="65" rx="8" fill="#142c43" stroke="#4c91c8"/><text x="24" y="40" class="t">SALS1 · richness 7</text><line x1="180" y1="65" x2="180" y2="98" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><rect y="105" width="360" height="65" rx="8" fill="#142c43" stroke="#4c91c8"/><text x="24" y="145" class="t">SALS2 · richness 6</text><line x1="180" y1="170" x2="180" y2="203" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><rect y="210" width="360" height="65" rx="8" fill="#142c43" stroke="#4c91c8"/><text x="24" y="250" class="t">SALS3 · richness 5</text></g>
  <line x1="520" y1="205" x2="520" y2="485" stroke="#29435b"/>
  <text x="600" y="155" class="t">Vectorised: one numerical object</text><g transform="translate(600 205)"><rect width="130" height="70" rx="8" fill="#c8f33d"/><rect x="140" width="130" height="70" rx="8" fill="#c8f33d"/><rect x="280" width="130" height="70" rx="8" fill="#c8f33d"/><text x="65" y="44" text-anchor="middle" class="c">7</text><text x="205" y="44" text-anchor="middle" class="c">6</text><text x="345" y="44" text-anchor="middle" class="c">5</text><text x="205" y="118" text-anchor="middle" class="t">richness &lt; 6</text><line x1="205" y1="130" x2="205" y2="175" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><rect y="190" width="130" height="70" rx="8" fill="#183d38"/><rect x="140" y="190" width="130" height="70" rx="8" fill="#183d38"/><rect x="280" y="190" width="130" height="70" rx="8" fill="#f39a4a"/><text x="65" y="233" text-anchor="middle" class="t">False</text><text x="205" y="233" text-anchor="middle" class="t">False</text><text x="345" y="233" text-anchor="middle" class="t">True</text></g>
  <text x="60" y="552" class="s">Both views require the same decisions about variable meaning, inclusion, missingness and interpretation.</text>
  <text x="60" y="580" class="s">Record values received and used, then check loop and vectorised results on the same known input.</text>
</svg>
