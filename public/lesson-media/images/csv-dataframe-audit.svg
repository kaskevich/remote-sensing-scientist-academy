<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CSV to pandas DataFrame structural audit</title><desc id="desc">An unchanged Zenodo CSV is loaded through an explicit relative path into a labelled DataFrame, then checked for shape, schema, identifiers and preview before analysis.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 17px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">PANDAS · VERIFY BEFORE ANALYSIS</text><text x="60" y="98" class="h">Source, path, table and structural evidence</text>
  <g transform="translate(60 185)"><rect width="245" height="190" rx="10" fill="#142c43" stroke="#4c91c8"/><text x="122" y="38" text-anchor="middle" class="t">UNCHANGED CSV</text><text x="122" y="70" text-anchor="middle" class="s">Zenodo 20083250</text><text x="122" y="98" text-anchor="middle" class="s">data/filename.csv</text><text x="122" y="132" text-anchor="middle" class="s">size · SHA-256</text><text x="122" y="160" text-anchor="middle" class="s">120 rows · 25 fields</text></g>
  <line x1="305" y1="280" x2="445" y2="280" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><text x="375" y="255" text-anchor="middle" class="s">read_csv</text>
  <g transform="translate(455 160)"><rect width="300" height="240" rx="10" fill="#10253a" stroke="#c8f33d"/><text x="150" y="42" text-anchor="middle" class="t">DATAFRAME</text><line x1="25" y1="65" x2="275" y2="65" stroke="#29435b"/><text x="40" y="98" class="s">row → quadrat</text><text x="40" y="132" class="s">column → field</text><text x="40" y="166" class="s">index → table label</text><text x="40" y="200" class="s">SampleID → identifier</text></g>
  <line x1="755" y1="280" x2="890" y2="280" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(900 160)"><rect width="240" height="240" rx="10" fill="#183d38" stroke="#4c91c8"/><text x="120" y="42" text-anchor="middle" class="t">AUDIT</text><text x="35" y="88" class="s">✓ path exists</text><text x="35" y="122" class="s">✓ shape</text><text x="35" y="156" class="s">✓ field names</text><text x="35" y="190" class="s">✓ unique IDs</text><text x="35" y="224" class="s">✓ first records</text></g>
  <text x="60" y="522" class="s">A successful load proves only that parsing completed. Assertions establish the structure that entered.</text>
  <text x="60" y="550" class="s">Intake acceptance permits quality audit; it does not validate measurements or scientific meaning.</text>
</svg>
