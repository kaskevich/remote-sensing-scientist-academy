<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Filter, group and summarise workflow</title><desc id="desc">A 120-row table passes through an explicit Boolean analysis mask, is partitioned into four site groups and becomes a summary reporting sample size, mean, median and spread.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 17px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}.n{fill:#071426;font:700 16px Inter,Arial}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">ANALYSIS POPULATION · MAKE IT COUNTABLE</text><text x="60" y="98" class="h">Filter rows, compare groups, retain denominators</text>
  <g transform="translate(60 205)"><rect width="210" height="170" rx="10" fill="#142c43" stroke="#4c91c8"/><text x="105" y="45" text-anchor="middle" class="t">SOURCE TABLE</text><text x="105" y="90" text-anchor="middle" class="s">120 quadrats</text><text x="105" y="125" text-anchor="middle" class="s">25 fields</text></g>
  <line x1="270" y1="290" x2="370" y2="290" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><text x="320" y="265" text-anchor="middle" class="s">Boolean mask</text>
  <g transform="translate(380 205)"><rect width="210" height="170" rx="10" fill="#c8f33d"/><text x="105" y="45" text-anchor="middle" class="n">ANALYSIS ROWS</text><text x="105" y="90" text-anchor="middle" class="n">criteria visible</text><text x="105" y="125" text-anchor="middle" class="n">selected count</text></g>
  <line x1="590" y1="290" x2="690" y2="290" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><text x="640" y="265" text-anchor="middle" class="s">group by site</text>
  <g transform="translate(700 180)"><rect width="210" height="55" rx="8" fill="#142c43"/><rect y="70" width="210" height="55" rx="8" fill="#142c43"/><rect y="140" width="210" height="55" rx="8" fill="#142c43"/><rect y="210" width="210" height="55" rx="8" fill="#142c43"/><text x="105" y="34" text-anchor="middle" class="t">Keemu · n 30</text><text x="105" y="104" text-anchor="middle" class="t">Koera · n 30</text><text x="105" y="174" text-anchor="middle" class="t">Kudani · n 40</text><text x="105" y="244" text-anchor="middle" class="t">Saardu · n 20</text></g>
  <line x1="910" y1="310" x2="990" y2="310" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(1000 205)"><rect width="150" height="210" rx="10" fill="#183d38" stroke="#c8f33d"/><text x="75" y="42" text-anchor="middle" class="t">SUMMARY</text><text x="35" y="90" class="s">n</text><text x="35" y="122" class="s">mean</text><text x="35" y="154" class="s">median</text><text x="35" y="186" class="s">SD</text></g>
  <text x="60" y="540" class="s">A grouped statistic is interpretable only when the selected population and group sizes remain visible.</text>
</svg>
