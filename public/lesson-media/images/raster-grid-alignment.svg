<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Raster grid alignment requires a complete contract</title>
  <desc id="desc">Two ten-metre grids in the same CRS are offset by five metres, so matching row and column indices refer to different ground footprints.</desc>
  <rect width="1200" height="650" rx="28" fill="#f5f7f4"/>
  <text x="60" y="64" fill="#0b1f35" font-family="Arial, sans-serif" font-size="30" font-weight="700">Same CRS and resolution can still be misaligned</text>
  <text x="60" y="98" fill="#526272" font-family="Arial, sans-serif" font-size="17">A five-metre origin shift makes every corresponding index describe a different footprint</text>
  <g transform="translate(80 145)" font-family="Arial, sans-serif">
    <rect width="480" height="350" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-size="18" font-weight="700">OVERLAID GRIDS</text>
    <g transform="translate(78 70)" fill="none">
      <g stroke="#17649f" stroke-width="3"><rect width="240" height="240"/><path d="M60 0V240M120 0V240M180 0V240M0 60H240M0 120H240M0 180H240"/></g>
      <g transform="translate(30 30)" stroke="#f28c28" stroke-width="2"><rect width="240" height="240"/><path d="M60 0V240M120 0V240M180 0V240M0 60H240M0 120H240M0 180H240"/></g>
      <circle cx="90" cy="90" r="7" fill="#17649f"/><circle cx="120" cy="120" r="7" fill="#f28c28"/>
    </g>
    <text x="350" y="105" fill="#17649f" font-size="15" font-weight="700">Grid A origin</text>
    <text x="350" y="132" fill="#f28c28" font-size="15" font-weight="700">Grid B +5 m</text>
    <text x="24" y="325" fill="#526272" font-size="15">Index [1,1] has two different cell centres and footprints</text>
  </g>
  <g transform="translate(600 145)" font-family="Arial, sans-serif">
    <rect width="520" height="350" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-size="18" font-weight="700">GRID CONTRACT</text>
    <g font-size="16">
      <text x="34" y="82" fill="#0b1f35">□ CRS</text><text x="270" y="82" fill="#0b1f35">□ transform / origin</text>
      <text x="34" y="120" fill="#0b1f35">□ x and y resolution</text><text x="270" y="120" fill="#0b1f35">□ dimensions</text>
      <text x="34" y="158" fill="#0b1f35">□ bounds / extent rule</text><text x="270" y="158" fill="#0b1f35">□ pixel orientation</text>
      <text x="34" y="196" fill="#0b1f35">□ NoData policy</text><text x="270" y="196" fill="#0b1f35">□ band semantics</text>
    </g>
    <path d="M24 225H496" stroke="#c9d4dc" stroke-width="2"/>
    <text x="24" y="262" fill="#526272" font-size="15">For cell-by-cell analysis, all spatial fields must agree.</text>
    <rect x="24" y="282" width="472" height="42" rx="12" fill="#dcecf7"/>
    <text x="260" y="309" text-anchor="middle" fill="#0b1f35" font-size="16" font-weight="700">Visual overlap diagnoses; metadata assertions prove</text>
  </g>
  <rect x="200" y="550" width="800" height="54" rx="18" fill="#0b1f35"/>
  <text x="600" y="584" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Same shape ≠ same grid · same CRS ≠ same alignment</text>
</svg>
