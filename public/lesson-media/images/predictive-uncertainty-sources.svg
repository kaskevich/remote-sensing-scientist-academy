<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Predictive uncertainty sources across an Earth Observation evidence chain</title>
  <desc id="desc">A left-to-right workflow separates measurement, sampling, processing, model, residual, spatial-transfer and temporal-transfer uncertainty. Each source connects to an appropriate evidence record rather than a single confidence score.</desc>
  <rect width="1200" height="660" fill="#FBF8F5"/>
  <text x="60" y="62" font-family="Georgia,serif" font-size="30" fill="#14263D">Where uncertainty enters the prediction</text>
  <text x="60" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52606D">Name the mechanism, evidence and scope before choosing a numerical representation</text>
  <g font-family="Arial,sans-serif">
    <g fill="#FFFFFF" stroke="#A35F47" stroke-width="2">
      <rect x="55" y="145" width="190" height="112" rx="8"/>
      <rect x="280" y="145" width="190" height="112" rx="8"/>
      <rect x="505" y="145" width="190" height="112" rx="8"/>
      <rect x="730" y="145" width="190" height="112" rx="8"/>
      <rect x="955" y="145" width="190" height="112" rx="8"/>
    </g>
    <g fill="#14263D" font-size="20" font-weight="700">
      <text x="75" y="178">Field target</text><text x="300" y="178">Sample design</text><text x="525" y="178">EO predictors</text><text x="750" y="178">Fitted model</text><text x="975" y="178">Deployment</text>
    </g>
    <g fill="#52606D" font-size="15">
      <text x="75" y="207">instrument · observer</text><text x="75" y="230">plot support · timing</text>
      <text x="300" y="207">sites · plots · dates</text><text x="300" y="230">represented population</text>
      <text x="525" y="207">sensor · geolocation</text><text x="525" y="230">processing · alignment</text>
      <text x="750" y="207">data · features · fit</text><text x="750" y="230">unresolved outcomes</text>
      <text x="975" y="207">new place · year</text><text x="975" y="230">sensor · regime shift</text>
    </g>
    <g stroke="#A35F47" stroke-width="2" fill="none">
      <path d="M245 201h35"/><path d="M470 201h35"/><path d="M695 201h35"/><path d="M920 201h35"/>
    </g>
    <g fill="#A35F47"><path d="M280 201l-10-6v12z"/><path d="M505 201l-10-6v12z"/><path d="M730 201l-10-6v12z"/><path d="M955 201l-10-6v12z"/></g>

    <text x="60" y="325" font-family="Georgia,serif" font-size="25" fill="#14263D">Different source → different evidence</text>
    <g>
      <rect x="55" y="355" width="250" height="190" rx="8" fill="#F6ECE8" stroke="#B97358"/>
      <rect x="335" y="355" width="250" height="190" rx="8" fill="#F6ECE8" stroke="#B97358"/>
      <rect x="615" y="355" width="250" height="190" rx="8" fill="#F6ECE8" stroke="#B97358"/>
      <rect x="895" y="355" width="250" height="190" rx="8" fill="#F6ECE8" stroke="#B97358"/>
    </g>
    <g fill="#14263D" font-size="18" font-weight="700">
      <text x="75" y="390">Measurement record</text><text x="355" y="390">Design evidence</text><text x="635" y="390">Predictive interval</text><text x="915" y="390">Transfer gates</text>
    </g>
    <g fill="#52606D" font-size="15">
      <text x="75" y="423">calibration certificate</text><text x="75" y="450">replicates and QA</text><text x="75" y="477">documented accuracy</text><text x="75" y="510">or mark unresolved</text>
      <text x="355" y="423">sampling frame</text><text x="355" y="450">independent groups</text><text x="355" y="477">structured validation</text><text x="355" y="510">coverage limitations</text>
      <text x="635" y="423">held-out residuals</text><text x="635" y="450">quantiles · conformal</text><text x="635" y="477">coverage and width</text><text x="635" y="510">represented outcomes</text>
      <text x="915" y="423">applicability</text><text x="915" y="450">sensor and time checks</text><text x="915" y="477">drift review</text><text x="915" y="510">withhold if unsupported</text>
    </g>
    <rect x="245" y="590" width="710" height="44" rx="22" fill="#14263D"/>
    <text x="600" y="618" text-anchor="middle" font-size="17" fill="#FFFFFF">Do not average unlike evidence into one unexplained confidence score</text>
  </g>
</svg>
