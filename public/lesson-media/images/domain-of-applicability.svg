<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A Domain of Applicability map separates supported predictions from environmental extrapolation</title>
  <desc id="desc">Training points define a represented region in predictor space. New points are classified as supported, review or outside applicability using nearest-analogue distance. A matching coastal map shows a prediction surface beside a categorical support layer that masks an environmentally novel coastal strip.</desc>
  <rect width="1200" height="720" fill="#FBF7F4"/>
  <style>.h{font:700 29px Georgia,serif;fill:#13263D}.s{font:700 17px Arial,sans-serif;fill:#13263D}.b{font:15px Arial,sans-serif;fill:#30465C}.t{font:13px Arial,sans-serif;fill:#52687D}.box{fill:#fff;stroke:#D9C7BD;stroke-width:2}.axis{stroke:#637487;stroke-width:2}.support{fill:#85A78E}.review{fill:#D4B86A}.outside{fill:#A35F47}.train{fill:#13263D}</style>
  <text x="55" y="58" class="h">Predict where evidence applies, not only where pixels exist</text>
  <g transform="translate(55 95)"><rect width="515" height="475" rx="15" class="box"/><text x="24" y="38" class="s">Predictor space · nearest analogue</text><line x1="70" y1="390" x2="465" y2="390" class="axis"/><line x1="70" y1="75" x2="70" y2="390" class="axis"/><ellipse cx="245" cy="235" rx="130" ry="115" fill="#E8F1EB" stroke="#85A78E" stroke-width="3"/><ellipse cx="245" cy="235" rx="170" ry="150" fill="none" stroke="#D4B86A" stroke-width="15" stroke-opacity=".55"/><g class="train"><circle cx="175" cy="205" r="7"/><circle cx="220" cy="160" r="7"/><circle cx="255" cy="245" r="7"/><circle cx="300" cy="205" r="7"/><circle cx="205" cy="285" r="7"/><circle cx="325" cy="285" r="7"/></g><circle cx="280" cy="250" r="10" class="support"/><circle cx="380" cy="175" r="10" class="review"/><circle cx="430" cy="100" r="11" class="outside"/><line x1="430" y1="100" x2="300" y2="205" stroke="#A35F47" stroke-width="2" stroke-dasharray="5 5"/><text x="344" y="88" class="t">novel combination</text><text x="215" y="430" class="b">Canopy structure</text><text x="25" y="285" class="b" transform="rotate(-90 25 285)">Moisture / spectral context</text><text x="24" y="458" class="t">Each feature can be in range while the combination is unsupported</text></g>
  <g transform="translate(605 95)"><rect width="540" height="475" rx="15" class="box"/><text x="24" y="38" class="s">Prediction and companion applicability layer</text><g transform="translate(28 75)"><rect width="220" height="290" rx="10" fill="#DDEACF"/><path d="M0 230 Q90 175 220 205 L220 290 L0 290 Z" fill="#8AB8CC"/><path d="M0 55 Q100 25 220 70" fill="none" stroke="#6C9E67" stroke-width="55" opacity=".8"/><text x="45" y="325" class="b">Complete prediction</text><text x="30" y="350" class="t">plausible colour everywhere</text></g><g transform="translate(288 75)"><rect width="220" height="290" rx="10" class="support"/><path d="M0 230 Q90 175 220 205 L220 290 L0 290 Z" fill="#8AB8CC"/><path d="M0 195 Q90 155 220 178 L220 230 Q90 175 0 230 Z" class="outside"/><path d="M0 160 Q90 125 220 150 L220 180 Q90 155 0 195 Z" class="review"/><text x="38" y="325" class="b">Applicability release</text><text x="22" y="350" class="t">coastal novelty remains visible</text></g></g>
  <g transform="translate(55 603)"><circle cx="10" cy="8" r="9" class="support"/><text x="28" y="14" class="b">supported</text><circle cx="155" cy="8" r="9" class="review"/><text x="173" y="14" class="b">review</text><circle cx="275" cy="8" r="9" class="outside"/><text x="293" y="14" class="b">outside applicability</text><circle cx="500" cy="8" r="7" class="train"/><text x="518" y="14" class="b">training evidence</text></g>
  <rect x="55" y="650" width="1090" height="48" rx="12" fill="#13263D"/><text x="82" y="681" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Unsupported regions must be flagged or masked; a model output is not proof of support</text>
</svg>
