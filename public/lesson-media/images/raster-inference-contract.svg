<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Raster inference contract and acceptance gates</title>
  <desc id="desc">A frozen model and feature schema pass through semantic, grid and valid-mask gates into deterministic raster windows, then produce aligned prediction and evidence layers that must pass numerical and spatial acceptance tests.</desc>
  <rect width="1200" height="680" fill="#FBF8F5"/><text x="60" y="62" font-family="Georgia,serif" font-size="32" fill="#14263D">Raster inference is a contract, not one predict call</text>
  <g font-family="Arial,sans-serif"><g fill="#FFFFFF" stroke="#A35F47" stroke-width="3">
    <rect x="55" y="125" width="205" height="105" rx="12"/><rect x="330" y="125" width="205" height="105" rx="12"/><rect x="605" y="125" width="205" height="105" rx="12"/><rect x="880" y="125" width="255" height="105" rx="12"/>
  </g><g fill="#14263D" text-anchor="middle"><text x="158" y="163" font-size="19" font-weight="700">Frozen package</text><text x="158" y="190" font-size="15">model + ordered schema</text><text x="158" y="213" font-size="15">unit · transform · support</text><text x="433" y="163" font-size="19" font-weight="700">Fail-closed gates</text><text x="433" y="190" font-size="15">semantics · grid · mask</text><text x="433" y="213" font-size="15">stop on mismatch</text><text x="708" y="163" font-size="19" font-weight="700">Windows</text><text x="708" y="190" font-size="15">rows × ordered features</text><text x="708" y="213" font-size="15">bounded memory</text><text x="1008" y="163" font-size="19" font-weight="700">Aligned outputs</text><text x="1008" y="190" font-size="15">prediction · interval</text><text x="1008" y="213" font-size="15">applicability · reason</text></g>
  <g stroke="#A35F47" stroke-width="4" fill="none"><path d="M260 177h62"/><path d="M535 177h62"/><path d="M810 177h62"/></g><g fill="#A35F47"><path d="M322 177l-14-8v16z"/><path d="M597 177l-14-8v16z"/><path d="M872 177l-14-8v16z"/></g>
  <text x="60" y="315" font-family="Georgia,serif" font-size="25" fill="#14263D">Acceptance evidence</text><g fill="#FFFFFF" stroke="#D8C8BF" stroke-width="2"><rect x="60" y="350" width="330" height="185" rx="10"/><rect x="435" y="350" width="330" height="185" rx="10"/><rect x="810" y="350" width="330" height="185" rx="10"/></g>
  <g fill="#14263D"><text x="85" y="389" font-size="19" font-weight="700">Numerical</text><text x="85" y="423" font-size="16">• window size invariant</text><text x="85" y="453" font-size="16">• golden rows within tolerance</text><text x="85" y="483" font-size="16">• output semantics and dtype</text><text x="460" y="389" font-size="19" font-weight="700">Spatial</text><text x="460" y="423" font-size="16">• CRS, transform and bounds</text><text x="460" y="453" font-size="16">• pixel-coordinate spot checks</text><text x="460" y="483" font-size="16">• NoData footprint preserved</text><text x="835" y="389" font-size="19" font-weight="700">Operational</text><text x="835" y="423" font-size="16">• complete run identity</text><text x="835" y="453" font-size="16">• checksums and atomic output</text><text x="835" y="483" font-size="16">• blockers prevent release</text></g>
  <rect x="260" y="585" width="680" height="52" rx="26" fill="#14263D"/><text x="600" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#FFFFFF">Same feature meaning in training and every predicted cell</text></g>
</svg>
