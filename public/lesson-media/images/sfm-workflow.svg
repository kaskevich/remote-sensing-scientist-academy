<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
  <title id="title">Software-independent Structure from Motion workflow</title><desc id="desc">Overlapping images proceed through feature detection and matching, tie points, pose and camera estimation, bundle adjustment, sparse and dense clouds, surface, orthorectification and mosaic.</desc>
  <style>.b{fill:#eef5ff;stroke:#1261a6;stroke-width:2}.n{fill:#f7f9fc;stroke:#6b7787;stroke-width:2}.t{font:600 14px system-ui;fill:#10233f}.s{font:12px system-ui;fill:#33445c}.a{stroke:#1261a6;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#1261a6"/></marker></defs>
  <g transform="translate(20 60)"><rect class="n" width="125" height="80" rx="9"/><text class="t" x="20" y="34">Overlapping</text><text class="t" x="34" y="55">images</text></g><path class="a" d="M145 100H175"/>
  <g transform="translate(175 60)"><rect class="b" width="125" height="80" rx="9"/><text class="t" x="24" y="34">Features +</text><text class="t" x="28" y="55">matches</text></g><path class="a" d="M300 100H330"/>
  <g transform="translate(330 60)"><rect class="b" width="125" height="80" rx="9"/><text class="t" x="30" y="45">Tie points</text></g><path class="a" d="M455 100H485"/>
  <g transform="translate(485 45)"><rect class="b" width="155" height="110" rx="9"/><text class="t" x="25" y="35">Pose + camera</text><text class="t" x="28" y="57">parameters</text><text class="s" x="22" y="86">bundle adjustment</text></g><path class="a" d="M640 100H670"/>
  <g transform="translate(670 60)"><rect class="n" width="125" height="80" rx="9"/><text class="t" x="25" y="34">Sparse then</text><text class="t" x="30" y="55">dense cloud</text></g><path class="a" d="M795 100H825"/>
  <g transform="translate(825 60)"><rect class="n" width="125" height="80" rx="9"/><text class="t" x="35" y="34">Surface</text><text class="t" x="28" y="55">model</text></g><path class="a" d="M950 100H980"/>
  <g transform="translate(980 45)"><rect class="b" width="125" height="110" rx="9"/><text class="t" x="17" y="35">Orthorectify</text><text class="t" x="31" y="57">+ mosaic</text></g>
  <text class="s" x="25" y="220">Internal reprojection residuals diagnose image geometry</text><text class="s" x="410" y="220">Control constrains the fitted solution</text><text class="s" x="760" y="220">Independent check points assess external accuracy</text><path class="a" d="M25 245H1090"/><text class="s" x="340" y="282">Every stage can propagate uncertainty into the final orthomosaic</text>
</svg>
