<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Bounded Earth Engine modelling component</title><desc id="desc">Catalogue imagery and documented field supports enter separate predictor and sampling contracts, join at a supported Earth Engine classifier, and pass independent validation and export gates. A side note shows XGBoost remains local or hybrid rather than native.</desc>
  <rect width="1200" height="680" fill="#FBF8F5"/><text x="55" y="60" font-family="Georgia,serif" font-size="32" fill="#14263D">Earth Engine supplies scale; the evidence contract supplies meaning</text>
  <g font-family="Arial,sans-serif"><g fill="#FFFFFF" stroke="#A35F47" stroke-width="3"><rect x="60" y="130" width="220" height="105" rx="10"/><rect x="60" y="320" width="220" height="105" rx="10"/><rect x="365" y="200" width="225" height="150" rx="10"/><rect x="675" y="200" width="210" height="150" rx="10"/><rect x="970" y="200" width="175" height="150" rx="10"/></g>
  <g fill="#14263D" text-anchor="middle"><text x="170" y="168" font-size="19" font-weight="700">ImageCollection</text><text x="170" y="196" font-size="15">mask · scale · dates</text><text x="170" y="218" font-size="15">predictor image</text><text x="170" y="358" font-size="19" font-weight="700">FeatureCollection</text><text x="170" y="386" font-size="15">target · support · IDs</text><text x="170" y="408" font-size="15">saved folds</text><text x="478" y="244" font-size="19" font-weight="700">Sampling contract</text><text x="478" y="274" font-size="15">scale and geometry meaning</text><text x="478" y="300" font-size="15">row and missingness audit</text><text x="780" y="244" font-size="19" font-weight="700">Supported ee.Classifier</text><text x="780" y="274" font-size="15">verified output mode</text><text x="780" y="300" font-size="15">development-only fit</text><text x="1058" y="244" font-size="19" font-weight="700">Export</text><text x="1058" y="274" font-size="15">task + asset + grid</text><text x="1058" y="300" font-size="15">independent QA</text></g>
  <g stroke="#A35F47" stroke-width="4" fill="none"><path d="M280 182L357 242"/><path d="M280 372L357 310"/><path d="M590 275h77"/><path d="M885 275h77"/></g><g fill="#A35F47"><path d="M357 242l-15-2 8-13z"/><path d="M357 310l-8 14-8-13z"/><path d="M667 275l-14-8v16z"/><path d="M962 275l-14-8v16z"/></g>
  <rect x="330" y="430" width="560" height="80" rx="10" fill="#F4E4DD" stroke="#A35F47"/><text x="610" y="461" text-anchor="middle" font-size="17" font-weight="700" fill="#14263D">Independent evidence stays visible</text><text x="610" y="488" text-anchor="middle" font-size="15" fill="#14263D">spatial folds · baseline · probability quality · applicability</text>
  <rect x="330" y="545" width="560" height="65" rx="32" fill="#14263D"/><text x="610" y="583" text-anchor="middle" font-size="17" fill="#FFFFFF">XGBoost required? Export predictors or samples to a local/hybrid system</text></g>
</svg>
