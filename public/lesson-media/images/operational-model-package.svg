<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Operational model package and release lifecycle</title><desc id="desc">A package boundary contains model, schema, training summary, evaluation, uncertainty, applicability, inference code, runbook and checksums. Structural, scientific and operational release gates lead to monitored operation, with update, rollback and retirement paths.</desc>
  <rect width="1200" height="700" fill="#FBF8F5"/><text x="55" y="56" font-family="Georgia,serif" font-size="31" fill="#14263D">The release unit is the model plus its evidence and controls</text>
  <g font-family="Arial,sans-serif"><rect x="55" y="95" width="700" height="485" rx="16" fill="#FFFFFF" stroke="#A35F47" stroke-width="4"/><text x="85" y="135" font-size="21" font-weight="700" fill="#14263D">environmental-monitoring-model 1.0.0</text>
  <g fill="#F4E4DD" stroke="#D5B3A6"><rect x="85" y="170" width="195" height="80" rx="8"/><rect x="308" y="170" width="195" height="80" rx="8"/><rect x="531" y="170" width="195" height="80" rx="8"/><rect x="85" y="275" width="195" height="80" rx="8"/><rect x="308" y="275" width="195" height="80" rx="8"/><rect x="531" y="275" width="195" height="80" rx="8"/><rect x="85" y="380" width="195" height="80" rx="8"/><rect x="308" y="380" width="195" height="80" rx="8"/><rect x="531" y="380" width="195" height="80" rx="8"/></g>
  <g fill="#14263D" text-anchor="middle"><text x="183" y="206" font-size="17" font-weight="700">Model</text><text x="183" y="231" font-size="14">format · version</text><text x="406" y="206" font-size="17" font-weight="700">Feature schema</text><text x="406" y="231" font-size="14">meaning · order</text><text x="629" y="206" font-size="17" font-weight="700">Training summary</text><text x="629" y="231" font-size="14">sites · dates · roles</text><text x="183" y="311" font-size="17" font-weight="700">Evaluation</text><text x="183" y="336" font-size="14">baseline · folds</text><text x="406" y="311" font-size="17" font-weight="700">Uncertainty</text><text x="406" y="336" font-size="14">coverage · limits</text><text x="629" y="311" font-size="17" font-weight="700">Applicability</text><text x="629" y="336" font-size="14">domain · withhold</text><text x="183" y="416" font-size="17" font-weight="700">Inference</text><text x="183" y="441" font-size="14">code · fixtures</text><text x="406" y="416" font-size="17" font-weight="700">Runbook</text><text x="406" y="441" font-size="14">monitor · respond</text><text x="629" y="416" font-size="17" font-weight="700">MODEL_CARD.md</text><text x="629" y="441" font-size="14">use · limits · owner</text></g>
  <rect x="85" y="490" width="641" height="55" rx="8" fill="#14263D"/><text x="406" y="524" text-anchor="middle" font-size="17" fill="#FFFFFF">environment lock · code commit · manifest checksums</text>
  <g fill="#FFFFFF" stroke="#A35F47" stroke-width="3"><rect x="825" y="120" width="320" height="90" rx="12"/><rect x="825" y="270" width="320" height="90" rx="12"/><rect x="825" y="420" width="320" height="90" rx="12"/></g><g fill="#14263D" text-anchor="middle"><text x="985" y="156" font-size="19" font-weight="700">Release gates</text><text x="985" y="182" font-size="15">structural · scientific · operational</text><text x="985" y="306" font-size="19" font-weight="700">Monitored operation</text><text x="985" y="332" font-size="15">immutable package + versioned runs</text><text x="985" y="456" font-size="19" font-weight="700">Governed lifecycle</text><text x="985" y="482" font-size="15">update · rollback · retire</text></g>
  <g stroke="#A35F47" stroke-width="4" fill="none"><path d="M755 335h62"/><path d="M985 210v52"/><path d="M985 360v52"/></g><g fill="#A35F47"><path d="M817 335l-14-8v16z"/><path d="M985 262l-8-14h16z"/><path d="M985 412l-8-14h16z"/></g>
  <text x="825" y="570" font-size="15" fill="#A35F47">Any blocker → refuse release</text><text x="825" y="600" font-size="15" fill="#14263D">No evidence → state “not evaluated”</text></g>
</svg>
