<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Feature relevance and stability across held-out site folds</title>
  <desc id="desc">A matrix shows stable positive relevance for canopy height, alternating relevance for correlated greenness indices, site-specific texture relevance and near-zero noise relevance across four site folds.</desc>
  <rect width="1200" height="700" fill="#FBF7F4"/>
  <style>.h{font:700 30px Georgia,serif;fill:#13263D}.s{font:700 18px Arial,sans-serif;fill:#13263D}.b{font:16px Arial,sans-serif;fill:#30465C}.tiny{font:14px Arial,sans-serif;fill:#30465C}.grid{stroke:#fff;stroke-width:4}.stable{fill:#A35F47}.mid{fill:#D9A18C}.low{fill:#F2DCD3}.zero{fill:#E8E9EA}.outline{fill:#fff;stroke:#D9C7BD;stroke-width:2}</style>
  <text x="55" y="62" class="h">A feature decision is a pattern across folds, not one rank</text>
  <rect x="55" y="105" width="760" height="490" rx="16" class="outline"/>
  <text x="325" y="145" class="s">Held-out development site</text>
  <text x="390" y="185" class="b">Coast A</text><text x="510" y="185" class="b">Coast B</text><text x="630" y="185" class="b">Coast C</text><text x="750" y="185" class="b">Coast D</text>
  <text x="82" y="242" class="b">UAV height p95</text><text x="82" y="322" class="b">Greenness index A</text><text x="82" y="402" class="b">Greenness index B</text><text x="82" y="482" class="b">Texture contrast</text><text x="82" y="562" class="b">Seeded noise</text>
  <g class="grid"><rect x="380" y="205" width="100" height="60" rx="7" class="stable"/><rect x="500" y="205" width="100" height="60" rx="7" class="stable"/><rect x="620" y="205" width="100" height="60" rx="7" class="stable"/><rect x="740" y="205" width="50" height="60" rx="7" class="stable"/>
  <rect x="380" y="285" width="100" height="60" rx="7" class="stable"/><rect x="500" y="285" width="100" height="60" rx="7" class="low"/><rect x="620" y="285" width="100" height="60" rx="7" class="mid"/><rect x="740" y="285" width="50" height="60" rx="7" class="low"/>
  <rect x="380" y="365" width="100" height="60" rx="7" class="low"/><rect x="500" y="365" width="100" height="60" rx="7" class="stable"/><rect x="620" y="365" width="100" height="60" rx="7" class="low"/><rect x="740" y="365" width="50" height="60" rx="7" class="mid"/>
  <rect x="380" y="445" width="100" height="60" rx="7" class="zero"/><rect x="500" y="445" width="100" height="60" rx="7" class="low"/><rect x="620" y="445" width="100" height="60" rx="7" class="stable"/><rect x="740" y="445" width="50" height="60" rx="7" class="zero"/>
  <rect x="380" y="525" width="100" height="60" rx="7" class="zero"/><rect x="500" y="525" width="100" height="60" rx="7" class="zero"/><rect x="620" y="525" width="100" height="60" rx="7" class="low"/><rect x="740" y="525" width="50" height="60" rx="7" class="zero"/></g>
  <rect x="850" y="105" width="305" height="490" rx="16" class="outline"/><text x="880" y="150" class="s">Interpret the pattern</text><circle cx="885" cy="205" r="11" class="stable"/><text x="910" y="211" class="b">Stable positive reliance</text><circle cx="885" cy="250" r="11" class="mid"/><text x="910" y="256" class="b">Moderate or variable</text><circle cx="885" cy="295" r="11" class="low"/><text x="910" y="301" class="b">Weak positive reliance</text><circle cx="885" cy="340" r="11" class="zero"/><text x="910" y="346" class="b">Near zero</text><line x1="880" y1="380" x2="1125" y2="380" stroke="#D9C7BD" stroke-width="2"/><text x="880" y="420" class="b">Ask before removal</text><text x="880" y="452" class="tiny">• Is the model useful on this fold?</text><text x="880" y="480" class="tiny">• Does a correlated partner substitute?</text><text x="880" y="508" class="tiny">• Is the feature available in operation?</text><text x="880" y="536" class="tiny">• Does site or season alter support?</text><text x="880" y="564" class="tiny">• What acquisition cost is avoided?</text>
  <text x="55" y="650" class="b">Colours represent synthetic teaching patterns, not measured importance. Preserve values, repeats, folds, metric and predictor meaning in the report.</text>
</svg>
