<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a scientifically interpretable raster</title>
  <desc id="desc">A numerical array is combined with an affine transform, coordinate reference system, valid-data mask and measurement semantics to form a geospatial raster.</desc>
  <rect width="1200" height="640" rx="28" fill="#f5f7f4"/>
  <text x="60" y="64" fill="#0b1f35" font-family="Arial, sans-serif" font-size="30" font-weight="700">A raster is more than an array</text>
  <text x="60" y="98" fill="#526272" font-family="Arial, sans-serif" font-size="17">Every part of the spatial contract is needed to interpret cell [row, column]</text>
  <g transform="translate(60 145)">
    <rect width="300" height="330" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-family="Arial, sans-serif" font-size="18" font-weight="700">VALUES</text>
    <g transform="translate(45 70)" stroke="#17649f" stroke-width="2">
      <rect width="210" height="168" fill="#e8f2fa"/>
      <path d="M70 0V168M140 0V168M0 56H210M0 112H210"/>
      <rect x="70" y="56" width="70" height="56" fill="#8cc3e8"/>
    </g>
    <text x="150" y="268" text-anchor="middle" fill="#0b1f35" font-family="Arial, sans-serif" font-size="17">rows × columns × bands</text>
    <text x="150" y="296" text-anchor="middle" fill="#526272" font-family="Arial, sans-serif" font-size="15">dtype · stored values</text>
  </g>
  <text x="393" y="318" fill="#17649f" font-family="Arial, sans-serif" font-size="36" font-weight="700">+</text>
  <g transform="translate(435 145)">
    <rect width="320" height="330" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-family="Arial, sans-serif" font-size="18" font-weight="700">GRID LOCATION</text>
    <path d="M52 210V80H270" fill="none" stroke="#0b1f35" stroke-width="3"/>
    <g transform="translate(75 102)" fill="#dcecf7" stroke="#438dc2" stroke-width="1.5">
      <rect width="54" height="45"/><rect x="54" width="54" height="45"/><rect x="108" width="54" height="45"/>
      <rect y="45" width="54" height="45"/><rect x="54" y="45" width="54" height="45" fill="#8cc3e8"/><rect x="108" y="45" width="54" height="45"/>
    </g>
    <circle cx="156" cy="169" r="6" fill="#f28c28"/>
    <text x="24" y="255" fill="#0b1f35" font-family="Arial, sans-serif" font-size="16">affine transform · CRS</text>
    <text x="24" y="282" fill="#526272" font-family="Arial, sans-serif" font-size="15">origin · resolution · bounds</text>
    <text x="24" y="307" fill="#526272" font-family="Arial, sans-serif" font-size="15">cell edge and centre coordinates</text>
  </g>
  <text x="788" y="318" fill="#17649f" font-family="Arial, sans-serif" font-size="36" font-weight="700">+</text>
  <g transform="translate(830 145)">
    <rect width="310" height="330" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/>
    <text x="24" y="40" fill="#17649f" font-family="Arial, sans-serif" font-size="18" font-weight="700">MEANING</text>
    <g font-family="Arial, sans-serif" font-size="16">
      <rect x="24" y="68" width="262" height="46" rx="10" fill="#e8f2fa"/><text x="42" y="97" fill="#0b1f35">variable and units</text>
      <rect x="24" y="126" width="262" height="46" rx="10" fill="#e8f2fa"/><text x="42" y="155" fill="#0b1f35">continuous or categorical</text>
      <rect x="24" y="184" width="262" height="46" rx="10" fill="#e8f2fa"/><text x="42" y="213" fill="#0b1f35">NoData and valid mask</text>
      <rect x="24" y="242" width="262" height="46" rx="10" fill="#e8f2fa"/><text x="42" y="271" fill="#0b1f35">spatial and temporal support</text>
    </g>
  </g>
  <rect x="176" y="520" width="848" height="62" rx="18" fill="#0b1f35"/>
  <text x="600" y="558" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Array + transform + CRS + mask + semantics = interpretable raster evidence</text>
</svg>
