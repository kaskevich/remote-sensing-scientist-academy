<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Random versus spatial validation</title>
  <desc id="desc">Two maps compare intermingled random training and assessment plots with a spatially separated assessment block. A claim bar shows that the first estimates interpolation among neighbours while the second tests transfer across space.</desc>
  <rect width="960" height="520" fill="#FFFDFC"/>
  <text x="50" y="52" font-family="Georgia,serif" font-size="28" fill="#17243A">The split defines the prediction claim</text>
  <rect x="50" y="88" width="400" height="290" rx="18" fill="#F6ECE8" stroke="#A35F47" stroke-width="3"/>
  <rect x="510" y="88" width="400" height="290" rx="18" fill="#F6ECE8" stroke="#A35F47" stroke-width="3"/>
  <text x="74" y="125" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17243A">RANDOM SPLIT</text>
  <text x="534" y="125" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17243A">SPATIAL SEPARATION</text>
  <path d="M80 160 C160 120 230 205 320 155 S415 210 430 260" fill="none" stroke="#D7C6BF" stroke-width="18" opacity=".7"/>
  <path d="M540 160 C620 120 690 205 780 155 S875 210 890 260" fill="none" stroke="#D7C6BF" stroke-width="18" opacity=".7"/>
  <g fill="#A35F47"><circle cx="105" cy="180" r="9"/><circle cx="155" cy="245" r="9"/><circle cx="225" cy="170" r="9"/><circle cx="285" cy="300" r="9"/><circle cx="370" cy="205" r="9"/><circle cx="405" cy="330" r="9"/></g>
  <g fill="#2E6F95"><rect x="119" y="287" width="18" height="18"/><rect x="195" y="220" width="18" height="18"/><rect x="306" y="178" width="18" height="18"/><rect x="346" y="276" width="18" height="18"/></g>
  <line x1="760" y1="142" x2="760" y2="352" stroke="#A35F47" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="770" y="145" width="105" height="200" rx="10" fill="#FFFFFF" stroke="#2E6F95" stroke-width="2"/>
  <g fill="#A35F47"><circle cx="555" cy="180" r="9"/><circle cx="605" cy="245" r="9"/><circle cx="650" cy="170" r="9"/><circle cx="700" cy="305" r="9"/><circle cx="730" cy="215" r="9"/></g>
  <g fill="#2E6F95"><rect x="790" y="190" width="18" height="18"/><rect x="835" y="245" width="18" height="18"/><rect x="805" y="305" width="18" height="18"/></g>
  <circle cx="77" cy="405" r="8" fill="#A35F47"/><text x="92" y="412" font-family="Arial,sans-serif" font-size="16" fill="#17243A">training observation</text>
  <rect x="272" y="397" width="16" height="16" fill="#2E6F95"/><text x="299" y="412" font-family="Arial,sans-serif" font-size="16" fill="#17243A">assessment observation</text>
  <rect x="50" y="442" width="400" height="48" rx="10" fill="#17243A"/><text x="75" y="472" font-family="Arial,sans-serif" font-size="16" fill="#FFFFFF">Evidence: nearby, represented conditions</text>
  <rect x="510" y="442" width="400" height="48" rx="10" fill="#A35F47"/><text x="535" y="472" font-family="Arial,sans-serif" font-size="16" fill="#FFFFFF">Evidence: transfer to withheld space</text>
</svg>
