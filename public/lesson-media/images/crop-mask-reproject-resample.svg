<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Four distinct raster operations</title>
  <desc id="desc">Crop changes rectangular extent, mask changes valid support, reproject changes coordinates and destination grid, and resample estimates values on another grid.</desc>
  <rect width="1200" height="670" rx="28" fill="#f5f7f4"/>
  <text x="60" y="64" fill="#0b1f35" font-family="Arial, sans-serif" font-size="30" font-weight="700">Name the property that changes</text>
  <text x="60" y="98" fill="#526272" font-family="Arial, sans-serif" font-size="17">Crop, mask, reproject and resample are related workflow steps, not synonyms</text>
  <g transform="translate(50 140)" font-family="Arial, sans-serif">
    <g transform="translate(0)"><rect width="260" height="380" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/><text x="24" y="42" fill="#17649f" font-size="19" font-weight="700">CROP</text><rect x="36" y="75" width="188" height="160" fill="#e8f2fa" stroke="#438dc2" stroke-width="2"/><rect x="80" y="108" width="96" height="92" fill="none" stroke="#f28c28" stroke-width="5"/><text x="24" y="280" fill="#0b1f35" font-size="16" font-weight="700">Changes</text><text x="24" y="306" fill="#526272" font-size="15">rectangular extent</text><text x="24" y="340" fill="#0b1f35" font-size="16" font-weight="700">Does not prove</text><text x="24" y="366" fill="#526272" font-size="15">inside-area validity</text></g>
    <g transform="translate(280)"><rect width="260" height="380" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/><text x="24" y="42" fill="#17649f" font-size="19" font-weight="700">MASK</text><rect x="36" y="75" width="188" height="160" fill="#d8e0e5" stroke="#438dc2" stroke-width="2"/><path d="M70 190L82 112L142 86L202 130L182 208L104 220Z" fill="#8cc3e8" stroke="#17649f" stroke-width="3"/><text x="24" y="280" fill="#0b1f35" font-size="16" font-weight="700">Changes</text><text x="24" y="306" fill="#526272" font-size="15">valid cell support</text><text x="24" y="340" fill="#0b1f35" font-size="16" font-weight="700">Requires</text><text x="24" y="366" fill="#526272" font-size="15">compatible geometry CRS</text></g>
    <g transform="translate(560)"><rect width="260" height="380" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/><text x="24" y="42" fill="#17649f" font-size="19" font-weight="700">REPROJECT</text><g transform="translate(42 82)" fill="none" stroke="#438dc2" stroke-width="2"><path d="M0 0H160V140H0Z"/><path d="M53 0V140M106 0V140M0 47H160M0 94H160"/><path d="M18 155L150 120L174 2" stroke="#f28c28" stroke-width="4"/></g><text x="24" y="280" fill="#0b1f35" font-size="16" font-weight="700">Changes</text><text x="24" y="306" fill="#526272" font-size="15">CRS and grid geometry</text><text x="24" y="340" fill="#0b1f35" font-size="16" font-weight="700">Does not create</text><text x="24" y="366" fill="#526272" font-size="15">new observations</text></g>
    <g transform="translate(840)"><rect width="260" height="380" rx="18" fill="#fff" stroke="#9db8cd" stroke-width="2"/><text x="24" y="42" fill="#17649f" font-size="19" font-weight="700">RESAMPLE</text><g transform="translate(36 82)" stroke="#438dc2"><rect width="90" height="140" fill="#e8f2fa" stroke-width="3"/><path d="M45 0V140M0 70H90"/><path d="M116 0V140M151 0V140M186 0V140M96 35H206M96 70H206M96 105H206" fill="none" stroke-width="1.5"/></g><text x="24" y="280" fill="#0b1f35" font-size="16" font-weight="700">Changes</text><text x="24" y="306" fill="#526272" font-size="15">sampling grid and values</text><text x="24" y="340" fill="#0b1f35" font-size="16" font-weight="700">Method follows</text><text x="24" y="366" fill="#526272" font-size="15">measurement semantics</text></g>
  </g>
  <rect x="180" y="570" width="840" height="54" rx="18" fill="#0b1f35"/>
  <text x="600" y="604" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Categorical classes: preserve labels · Continuous fields: justify interpolation or aggregation</text>
</svg>
