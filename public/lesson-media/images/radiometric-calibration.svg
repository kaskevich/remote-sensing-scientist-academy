<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Radiometric evidence chain for UAV imagery</title><desc id="desc">Sunlight, atmosphere, surface, camera response, calibration panel, irradiance sensor and metadata contribute to a reflectance product with remaining uncertainty.</desc>
  <style>.b{fill:#eef5ff;stroke:#1261a6;stroke-width:2}.n{fill:#f7f9fc;stroke:#6b7787;stroke-width:2}.w{fill:#fff3c9;stroke:#b68100;stroke-width:2}.t{font:600 16px system-ui;fill:#10233f}.s{font:13px system-ui;fill:#33445c}.a{stroke:#1261a6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#1261a6"/></marker></defs>
  <rect class="w" x="30" y="125" width="145" height="90" rx="10"/><text class="t" x="68" y="160">Illumination</text><text class="s" x="50" y="188">sun, cloud, angle</text><path class="a" d="M175 170H235"/>
  <rect class="n" x="235" y="125" width="145" height="90" rx="10"/><text class="t" x="278" y="160">Surface</text><text class="s" x="255" y="188">directional response</text><path class="a" d="M380 170H440"/>
  <rect class="b" x="440" y="125" width="160" height="90" rx="10"/><text class="t" x="473" y="160">Sensor DN</text><text class="s" x="460" y="188">exposure + response</text><path class="a" d="M600 170H660"/>
  <rect class="b" x="660" y="105" width="270" height="130" rx="10"/><text class="t" x="708" y="145">Reflectance product</text><text class="s" x="685" y="176">calibration + corrections</text><text class="s" x="685" y="204">with documented uncertainty</text>
  <rect class="n" x="255" y="270" width="170" height="55" rx="8"/><text class="s" x="274" y="302">Reference panel evidence</text><path class="a" d="M340 270V225"/><rect class="n" x="475" y="270" width="190" height="55" rx="8"/><text class="s" x="492" y="302">Irradiance time series</text><path class="a" d="M570 270V225"/>
</svg>
