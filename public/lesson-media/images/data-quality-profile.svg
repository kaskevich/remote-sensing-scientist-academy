<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Auditable data-quality workflow</title><desc id="desc">The workflow separates observation of missingness, dtypes and duplicates from field-specific scientific rules, documented actions and a quality report.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 17px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}.n{fill:#071426;font:700 16px Inter,Arial}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">DATA QUALITY · OBSERVE BEFORE CLEANING</text><text x="60" y="98" class="h">Description, rule, action and audit trail</text>
  <g transform="translate(60 190)"><rect width="240" height="210" rx="10" fill="#c8f33d"/><text x="120" y="42" text-anchor="middle" class="n">1 · OBSERVE</text><text x="30" y="88" class="n">completeness</text><text x="30" y="122" class="n">conformance</text><text x="30" y="156" class="n">consistency</text><text x="30" y="190" class="n">identity</text></g>
  <line x1="300" y1="295" x2="385" y2="295" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(395 190)"><rect width="240" height="210" rx="10" fill="#142c43" stroke="#4c91c8"/><text x="120" y="42" text-anchor="middle" class="t">2 · DEFINE RULE</text><text x="30" y="88" class="s">named field</text><text x="30" y="122" class="s">criterion</text><text x="30" y="156" class="s">provenance</text><text x="30" y="190" class="s">scope</text></g>
  <line x1="635" y1="295" x2="720" y2="295" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(730 190)"><rect width="180" height="210" rx="10" fill="#142c43" stroke="#f39a4a"/><text x="90" y="42" text-anchor="middle" class="t">3 · ACT</text><text x="30" y="88" class="s">retain</text><text x="30" y="122" class="s">review</text><text x="30" y="156" class="s">exclude</text><text x="30" y="190" class="s">seek metadata</text></g>
  <line x1="910" y1="295" x2="985" y2="295" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(995 190)"><rect width="145" height="210" rx="10" fill="#183d38" stroke="#c8f33d"/><text x="72" y="42" text-anchor="middle" class="t">4 · LOG</text><text x="72" y="96" text-anchor="middle" class="s">denominator</text><text x="72" y="130" text-anchor="middle" class="s">provenance</text><text x="72" y="164" text-anchor="middle" class="s">reversibility</text><text x="72" y="198" text-anchor="middle" class="s">risk</text></g>
  <text x="60" y="522" class="s">Cleaning is not one command. Different fields and questions require different evidence and responses.</text>
  <text x="60" y="550" class="s">Keep source values beside flags; “not flagged” is not the same as validated.</text>
</svg>
