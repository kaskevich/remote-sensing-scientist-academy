<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Vegetation Data Explorer claim-evidence workflow</title><desc id="desc">A connected workflow moves from a focused question through provenance, quality checks, analysis population, tested methods, results, interpretation and reproducible export, with a feedback loop from interpretation to question.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 16px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}.n{fill:#071426;font:700 16px Inter,Arial}</style></defs>
  <rect width="1200" height="650" fill="#071426"/><text x="60" y="55" class="k">PORTFOLIO PROJECT · CLAIM–EVIDENCE CHAIN</text><text x="60" y="98" class="h">Every conclusion remains traceable</text>
  <g transform="translate(55 180)"><rect width="150" height="95" rx="9" fill="#c8f33d"/><text x="75" y="40" text-anchor="middle" class="n">QUESTION</text><text x="75" y="68" text-anchor="middle" class="n">focused</text></g><line x1="205" y1="228" x2="245" y2="228" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(255 180)"><rect width="150" height="95" rx="9" fill="#142c43" stroke="#4c91c8"/><text x="75" y="40" text-anchor="middle" class="t">SOURCE</text><text x="75" y="68" text-anchor="middle" class="s">DOI · file · licence</text></g><line x1="405" y1="228" x2="445" y2="228" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(455 180)"><rect width="150" height="95" rx="9" fill="#142c43" stroke="#4c91c8"/><text x="75" y="40" text-anchor="middle" class="t">QUALITY</text><text x="75" y="68" text-anchor="middle" class="s">profile · flags</text></g><line x1="605" y1="228" x2="645" y2="228" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(655 180)"><rect width="150" height="95" rx="9" fill="#142c43" stroke="#4c91c8"/><text x="75" y="40" text-anchor="middle" class="t">POPULATION</text><text x="75" y="68" text-anchor="middle" class="s">filters · n</text></g><line x1="805" y1="228" x2="845" y2="228" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(855 180)"><rect width="150" height="95" rx="9" fill="#142c43" stroke="#4c91c8"/><text x="75" y="40" text-anchor="middle" class="t">METHOD</text><text x="75" y="68" text-anchor="middle" class="s">functions · tests</text></g><line x1="1005" y1="228" x2="1045" y2="228" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(1055 180)"><rect width="110" height="95" rx="9" fill="#183d38" stroke="#c8f33d"/><text x="55" y="40" text-anchor="middle" class="t">RESULTS</text><text x="55" y="68" text-anchor="middle" class="s">tables · figures</text></g>
  <line x1="1110" y1="275" x2="1110" y2="390" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(855 405)"><rect width="310" height="105" rx="9" fill="#142c43" stroke="#f39a4a"/><text x="155" y="40" text-anchor="middle" class="t">INTERPRETATION</text><text x="155" y="70" text-anchor="middle" class="s">finding · uncertainty · limitation · next evidence</text></g>
  <line x1="855" y1="458" x2="665" y2="458" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(385 405)"><rect width="270" height="105" rx="9" fill="#183d38" stroke="#c8f33d"/><text x="135" y="40" text-anchor="middle" class="t">REPRODUCIBLE EXPORT</text><text x="135" y="70" text-anchor="middle" class="s">Run All · notebook · tables · figures</text></g>
  <path d="M385 458 C210 458 130 390 130 285" fill="none" stroke="#4c91c8" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/><text x="165" y="410" class="s">revise question when evidence requires it</text>
  <text x="60" y="595" class="s">The notebook is professional when a reviewer can move backward from every claim to its source and decision trail.</text>
</svg>
