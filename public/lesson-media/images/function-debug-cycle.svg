<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-led function debugging cycle</title><desc id="desc">Five connected stages move from expected behaviour to a small test, traceback evidence, one controlled correction and rerunning all tests.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 17px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}.num{fill:#071426;font:700 17px Inter,Arial}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">DEBUGGING · CHANGE ONE CAUSE</text><text x="60" y="98" class="h">Compare expected and actual behaviour</text>
  <path d="M250 250 C380 110 760 110 900 245 C1040 380 805 530 600 500 C390 530 150 390 250 250" fill="none" stroke="#29435b" stroke-width="3" stroke-dasharray="8 8"/>
  <g><circle cx="250" cy="260" r="70" fill="#c8f33d"/><text x="250" y="253" text-anchor="middle" class="num">1</text><text x="250" y="278" text-anchor="middle" class="num">EXPECT</text><circle cx="485" cy="175" r="70" fill="#142c43" stroke="#4c91c8"/><text x="485" y="169" text-anchor="middle" class="t">2 · SMALL</text><text x="485" y="193" text-anchor="middle" class="s">repeatable test</text><circle cx="760" cy="190" r="70" fill="#142c43" stroke="#4c91c8"/><text x="760" y="184" text-anchor="middle" class="t">3 · READ</text><text x="760" y="208" text-anchor="middle" class="s">traceback evidence</text><circle cx="890" cy="395" r="70" fill="#142c43" stroke="#f39a4a"/><text x="890" y="389" text-anchor="middle" class="t">4 · CHANGE</text><text x="890" y="413" text-anchor="middle" class="s">one cause</text><circle cx="570" cy="455" r="70" fill="#183d38" stroke="#c8f33d"/><text x="570" y="449" text-anchor="middle" class="t">5 · RERUN</text><text x="570" y="473" text-anchor="middle" class="s">all known tests</text></g>
  <line x1="315" y1="235" x2="410" y2="200" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><line x1="555" y1="178" x2="685" y2="185" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><line x1="815" y1="235" x2="858" y2="323" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/><line x1="825" y1="420" x2="643" y2="450" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <text x="60" y="575" class="s">No traceback can detect a scientifically weak assumption. Test logic and meaning separately.</text>
</svg>
