<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Local, Earth Engine and hybrid modelling architecture decision</title><desc id="desc">Three architecture columns compare local Python, native Earth Engine and a hybrid design. Requirements and scientific controls enter from above; evidence, interface risk and operational ownership lead to a documented decision with review triggers.</desc>
  <rect width="1200" height="700" fill="#FBF8F5"/><text x="60" y="58" font-family="Georgia,serif" font-size="31" fill="#14263D">Choose responsibilities from requirements, not platform fashion</text>
  <g font-family="Arial,sans-serif"><rect x="200" y="90" width="800" height="65" rx="32" fill="#14263D"/><text x="600" y="130" text-anchor="middle" font-size="18" fill="#FFFFFF">claim · validation · scale · data governance · algorithm · operation</text>
  <g fill="#FFFFFF" stroke="#A35F47" stroke-width="3"><rect x="60" y="225" width="320" height="270" rx="12"/><rect x="440" y="225" width="320" height="270" rx="12"/><rect x="820" y="225" width="320" height="270" rx="12"/></g>
  <g fill="#14263D"><text x="220" y="267" text-anchor="middle" font-size="22" font-weight="700">Local Python</text><text x="85" y="308" font-size="16">+ custom XGBoost and validation</text><text x="85" y="342" font-size="16">+ controlled environments</text><text x="85" y="376" font-size="16">− team owns compute and storage</text><text x="85" y="410" font-size="16">− archive access can be costly</text><text x="85" y="454" font-size="15" fill="#A35F47">Best when control dominates scale</text>
  <text x="600" y="267" text-anchor="middle" font-size="22" font-weight="700">Earth Engine</text><text x="465" y="308" font-size="16">+ archive-scale server processing</text><text x="465" y="342" font-size="16">+ supported native classifiers</text><text x="465" y="376" font-size="16">− no native XGBoost</text><text x="465" y="410" font-size="16">− managed-service dependencies</text><text x="465" y="454" font-size="15" fill="#A35F47">Best when native fit meets the claim</text>
  <text x="980" y="267" text-anchor="middle" font-size="22" font-weight="700">Hybrid</text><text x="845" y="308" font-size="16">+ archive preparation + local ML</text><text x="845" y="342" font-size="16">+ separates sensitive targets</text><text x="845" y="376" font-size="16">− schema and transfer boundaries</text><text x="845" y="410" font-size="16">− two systems to operate</text><text x="845" y="454" font-size="15" fill="#A35F47">Best only when interfaces earn cost</text></g>
  <g stroke="#A35F47" stroke-width="4"><path d="M600 155v52"/><path d="M600 207L220 217"/><path d="M600 207v10"/><path d="M600 207l380 10"/></g><circle cx="600" cy="207" r="7" fill="#A35F47"/>
  <rect x="170" y="555" width="860" height="82" rx="12" fill="#F4E4DD" stroke="#A35F47"/><text x="600" y="587" text-anchor="middle" font-size="19" font-weight="700" fill="#14263D">Decision record</text><text x="600" y="616" text-anchor="middle" font-size="16" fill="#14263D">responsibilities · interfaces · owners · acceptance tests · rejected options · review triggers</text></g>
</svg>
