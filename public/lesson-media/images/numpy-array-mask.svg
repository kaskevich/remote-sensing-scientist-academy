<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NumPy array comparison and Boolean mask</title><desc id="desc">A richness array of ten values has shape ten. A less-than-six comparison produces an aligned Boolean mask that selects five positions.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8f33d"/></marker><style>.h{fill:#f7f3e9;font:600 31px Inter,Arial}.k{fill:#c8f33d;font:700 14px Inter,Arial;letter-spacing:2px}.t{fill:#f7f3e9;font:600 17px Inter,Arial}.s{fill:#9fb2c4;font:400 14px Inter,Arial}.c{fill:#071426;font:700 18px ui-monospace,monospace}</style></defs>
  <rect width="1200" height="620" fill="#071426"/><text x="60" y="55" class="k">NUMPY · POSITIONAL ALIGNMENT</text><text x="60" y="98" class="h">One comparison, one mask of the same shape</text>
  <text x="60" y="160" class="t">richness · shape (10,) · integer dtype</text><g transform="translate(60 185)"><rect width="1030" height="72" rx="8" fill="#10253a" stroke="#4c91c8"/><g fill="#c8f33d"><rect x="15" y="12" width="85" height="48" rx="5"/><rect x="116" y="12" width="85" height="48" rx="5"/><rect x="217" y="12" width="85" height="48" rx="5"/><rect x="318" y="12" width="85" height="48" rx="5"/><rect x="419" y="12" width="85" height="48" rx="5"/><rect x="520" y="12" width="85" height="48" rx="5"/><rect x="621" y="12" width="85" height="48" rx="5"/><rect x="722" y="12" width="85" height="48" rx="5"/><rect x="823" y="12" width="85" height="48" rx="5"/><rect x="924" y="12" width="85" height="48" rx="5"/></g><g class="c" text-anchor="middle"><text x="57" y="44">7</text><text x="158" y="44">6</text><text x="259" y="44">5</text><text x="360" y="44">7</text><text x="461" y="44">7</text><text x="562" y="44">3</text><text x="663" y="44">5</text><text x="764" y="44">7</text><text x="865" y="44">3</text><text x="966" y="44">4</text></g></g>
  <text x="575" y="315" text-anchor="middle" class="t">richness &lt; 6</text><line x1="575" y1="330" x2="575" y2="375" stroke="#c8f33d" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(60 395)"><rect width="1030" height="72" rx="8" fill="#10253a" stroke="#4c91c8"/><g class="t" text-anchor="middle"><text x="57" y="44">False</text><text x="158" y="44">False</text><text x="259" y="44" fill="#f39a4a">True</text><text x="360" y="44">False</text><text x="461" y="44">False</text><text x="562" y="44" fill="#f39a4a">True</text><text x="663" y="44" fill="#f39a4a">True</text><text x="764" y="44">False</text><text x="865" y="44" fill="#f39a4a">True</text><text x="966" y="44" fill="#f39a4a">True</text></g></g>
  <text x="60" y="528" class="s">Five True positions select five observed values. Selection changes the represented population.</text>
  <text x="60" y="556" class="s">Assert equal shapes and a known count; neither check proves that the threshold is ecological.</text>
</svg>
