<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Temporal validation directions</title>
  <desc id="desc">A top timeline marks a contaminated random split where future observations enter training for an earlier assessment. A lower timeline shows rolling-origin folds that always train on earlier years and assess the next year, with drift checks beside each assessment.</desc>
  <rect width="960" height="520" fill="#FFFDFC"/>
  <text x="50" y="52" font-family="Georgia,serif" font-size="29" fill="#17243A">Time has a direction</text>
  <text x="50" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#A35F47">CONTAMINATED COMPARISON</text>
  <line x1="105" y1="160" x2="865" y2="160" stroke="#17243A" stroke-width="3"/>
  <g font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="190" y="195" fill="#17243A">2023</text><text x="470" y="195" fill="#17243A">2024</text><text x="750" y="195" fill="#17243A">2025</text></g>
  <g fill="#A35F47"><circle cx="155" cy="160" r="12"/><circle cx="435" cy="160" r="12"/><circle cx="705" cy="160" r="12"/><circle cx="795" cy="160" r="12"/></g>
  <rect x="235" y="147" width="24" height="24" fill="#2E6F95"/>
  <path d="M705 130 C610 70 365 70 247 132" fill="none" stroke="#C94F45" stroke-width="4" marker-end="url(#redArrow)"/>
  <text x="475" y="76" font-family="Arial,sans-serif" font-size="16" fill="#C94F45" text-anchor="middle">future information influences an earlier assessment</text>
  <text x="50" y="260" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#A35F47">FORWARD / ROLLING ORIGIN</text>
  <rect x="80" y="295" width="230" height="58" rx="10" fill="#F6ECE8" stroke="#A35F47" stroke-width="2"/><text x="195" y="329" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#17243A">train 2023</text>
  <rect x="330" y="295" width="145" height="58" rx="10" fill="#E4EEF4" stroke="#2E6F95" stroke-width="2"/><text x="402" y="329" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#17243A">assess 2024</text>
  <rect x="80" y="378" width="395" height="58" rx="10" fill="#F6ECE8" stroke="#A35F47" stroke-width="2"/><text x="278" y="412" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#17243A">train 2023 + 2024</text>
  <rect x="495" y="378" width="145" height="58" rx="10" fill="#E4EEF4" stroke="#2E6F95" stroke-width="2"/><text x="568" y="412" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#17243A">assess 2025</text>
  <rect x="690" y="294" width="215" height="142" rx="12" fill="#17243A"/>
  <text x="712" y="326" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CHECK DRIFT</text>
  <text x="712" y="356" font-family="Arial,sans-serif" font-size="15" fill="#FFFFFF">phenology</text><text x="712" y="382" font-family="Arial,sans-serif" font-size="15" fill="#FFFFFF">management</text><text x="712" y="408" font-family="Arial,sans-serif" font-size="15" fill="#FFFFFF">sensor + environment</text>
  <defs><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C94F45"/></marker></defs>
</svg>
