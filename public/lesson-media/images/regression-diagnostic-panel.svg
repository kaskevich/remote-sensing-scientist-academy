<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four coordinated views diagnose regression prediction error</title>
  <desc id="desc">Observed versus predicted values show compression at high vegetation height, residuals versus fitted values show directional structure, a residual distribution shows a negative tail, and fold summaries reveal one weak held-out site. The diagram states that one score cannot describe all failures.</desc>
  <rect width="1200" height="720" fill="#FBF7F4"/>
  <style>.h{font:700 29px Georgia,serif;fill:#13263D}.s{font:700 17px Arial,sans-serif;fill:#13263D}.b{font:15px Arial,sans-serif;fill:#30465C}.t{font:13px Arial,sans-serif;fill:#52687D}.p{fill:#A35F47}.p2{fill:#6B86A0}.box{fill:#fff;stroke:#D9C7BD;stroke-width:2}.note{fill:#fff;opacity:.94}.axis{stroke:#637487;stroke-width:2}.ref{stroke:#A35F47;stroke-width:2;stroke-dasharray:6 5}</style>
  <text x="55" y="55" class="h">Regression evidence is a coordinated diagnostic, not one score</text>
  <g transform="translate(55 90)"><rect width="520" height="245" rx="14" class="box"/><text x="24" y="33" class="s">Observed versus predicted</text><line x1="65" y1="205" x2="475" y2="205" class="axis"/><line x1="65" y1="55" x2="65" y2="205" class="axis"/><line x1="70" y1="198" x2="450" y2="68" class="ref"/>
    <g class="p"><circle cx="105" cy="182" r="6"/><circle cx="150" cy="164" r="6"/><circle cx="215" cy="145" r="6"/><circle cx="280" cy="123" r="6"/><circle cx="350" cy="115" r="6"/><circle cx="430" cy="108" r="7"/></g><rect x="290" y="58" width="190" height="28" rx="5" class="note"/><text x="300" y="77" class="t">high values underpredicted</text><text x="218" y="230" class="b">Observed height</text><text x="25" y="170" class="b" transform="rotate(-90 25 170)">Predicted</text></g>
  <g transform="translate(625 90)"><rect width="520" height="245" rx="14" class="box"/><text x="24" y="33" class="s">Residual versus fitted</text><line x1="65" y1="205" x2="475" y2="205" class="axis"/><line x1="65" y1="55" x2="65" y2="205" class="axis"/><line x1="65" y1="130" x2="475" y2="130" class="ref"/>
    <g class="p"><circle cx="105" cy="108" r="6"/><circle cx="155" cy="117" r="6"/><circle cx="225" cy="132" r="6"/><circle cx="290" cy="145" r="6"/><circle cx="360" cy="169" r="6"/><circle cx="435" cy="190" r="7"/></g><rect x="270" y="58" width="220" height="28" rx="5" class="note"/><text x="280" y="77" class="t">remaining directional pattern</text><text x="215" y="230" class="b">Fitted height</text><text x="25" y="152" class="b" transform="rotate(-90 25 152)">Residual</text></g>
  <g transform="translate(55 370)"><rect width="520" height="245" rx="14" class="box"/><text x="24" y="33" class="s">Residual distribution</text><line x1="65" y1="205" x2="475" y2="205" class="axis"/><line x1="270" y1="88" x2="270" y2="205" class="ref"/><g fill="#B97358"><rect x="100" y="175" width="38" height="30"/><rect x="142" y="147" width="38" height="58"/><rect x="184" y="112" width="38" height="93"/><rect x="226" y="80" width="38" height="125"/><rect x="268" y="92" width="38" height="113"/><rect x="310" y="132" width="38" height="73"/><rect x="352" y="168" width="38" height="37"/></g><rect x="72" y="51" width="235" height="28" rx="5" class="note"/><text x="82" y="70" class="t">tail and asymmetry remain visible</text><text x="195" y="230" class="b">Signed residual</text></g>
  <g transform="translate(625 370)"><rect width="520" height="245" rx="14" class="box"/><text x="24" y="33" class="s">Outer-fold performance</text><line x1="90" y1="205" x2="475" y2="205" class="axis"/><line x1="90" y1="55" x2="90" y2="205" class="axis"/>
    <g stroke="#6B86A0" stroke-width="7"><line x1="150" y1="170" x2="150" y2="120"/><line x1="235" y1="158" x2="235" y2="103"/><line x1="320" y1="185" x2="320" y2="138"/></g><line x1="405" y1="198" x2="405" y2="82" stroke="#A35F47" stroke-width="8"/><g class="p2"><circle cx="150" cy="145" r="8"/><circle cx="235" cy="130" r="8"/><circle cx="320" cy="160" r="8"/></g><circle cx="405" cy="115" r="9" class="p"/><text x="137" y="225" class="t">A</text><text x="222" y="225" class="t">B</text><text x="307" y="225" class="t">C</text><text x="392" y="225" class="t">D</text><rect x="315" y="49" width="170" height="28" rx="5" class="note"/><text x="325" y="68" class="t">one weak transfer site</text></g>
  <rect x="55" y="648" width="1090" height="48" rx="12" fill="#13263D"/><text x="82" y="679" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Read magnitude, direction, relative variation, residual shape and fold spread together</text>
</svg>
