<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Validated UAV multispectral stack workflow</title><desc id="desc">Band identity, scale, radiometry, alignment and masks are validated before safe indices, DSM integration, extraction and a manifest.</desc>
  <style>.b{fill:#eef5ff;stroke:#1261a6;stroke-width:2}.n{fill:#f7f9fc;stroke:#6b7787;stroke-width:2}.bad{fill:#fff3c9;stroke:#b68100;stroke-width:2}.t{font:600 15px system-ui;fill:#10233f}.s{font:13px system-ui;fill:#33445c}.a{stroke:#1261a6;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#1261a6"/></marker></defs>
  <rect class="n" x="30" y="45" width="180" height="55" rx="9"/><text class="t" x="65" y="78">Band inventory</text><path class="a" d="M210 72H260"/><rect class="b" x="260" y="30" width="205" height="85" rx="9"/><text class="t" x="293" y="62">Identity + scale</text><text class="s" x="282" y="88">radiometry + range</text><path class="a" d="M465 72H515"/><rect class="b" x="515" y="30" width="205" height="85" rx="9"/><text class="t" x="560" y="62">Grid contract</text><text class="s" x="537" y="88">co-registration + masks</text><path class="a" d="M720 72H770"/><rect class="n" x="770" y="30" width="180" height="85" rx="9"/><text class="t" x="807" y="62">Accepted bands</text><text class="s" x="792" y="88">cell-wise comparable</text>
  <path class="a" d="M860 115V170"/><rect class="b" x="705" y="170" width="245" height="80" rx="9"/><text class="t" x="746" y="202">Safe index calculation</text><text class="s" x="728" y="228">joint mask + denominator rule</text><path class="a" d="M705 210H650"/>
  <rect class="n" x="390" y="170" width="260" height="80" rx="9"/><text class="t" x="435" y="202">DSM + QA mask + support</text><text class="s" x="430" y="228">align before integration</text><path class="a" d="M390 210H335"/><rect class="b" x="70" y="170" width="265" height="80" rx="9"/><text class="t" x="115" y="202">Extraction + manifest</text><text class="s" x="96" y="228">source, equation, QA, limits</text>
  <rect class="bad" x="210" y="310" width="560" height="70" rx="10"/><text class="t" x="290" y="340">Stop when scale, band identity or alignment is unresolved</text><text class="s" x="270" y="364">A vegetation-index number is not evidence that the inputs were comparable.</text>
</svg>
