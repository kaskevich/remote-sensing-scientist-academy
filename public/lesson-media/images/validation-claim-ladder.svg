<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Validation claim ladder</title>
  <desc id="desc">Four ascending steps connect prediction within known sites, prediction in new blocks, prediction at a new site and prediction in another region to increasingly separated validation units. A warning states that stricter separation changes the question rather than automatically improving the model.</desc>
  <rect width="960" height="520" fill="#FFFDFC"/>
  <text x="52" y="55" font-family="Georgia,serif" font-size="29" fill="#17243A">Withhold the unit you claim to predict</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="340" width="190" height="92" rx="12" fill="#F6ECE8" stroke="#A35F47" stroke-width="3"/>
    <text x="80" y="370" font-size="16" font-weight="700" fill="#A35F47">KNOWN SITE</text><text x="80" y="397" font-size="15" fill="#17243A">random or grouped plots</text>
    <rect x="250" y="270" width="200" height="162" rx="12" fill="#F0DED7" stroke="#A35F47" stroke-width="3"/>
    <text x="273" y="302" font-size="16" font-weight="700" fill="#A35F47">NEW BLOCK</text><text x="273" y="330" font-size="15" fill="#17243A">spatial blocks withheld</text>
    <rect x="450" y="190" width="205" height="242" rx="12" fill="#E8CFC5" stroke="#A35F47" stroke-width="3"/>
    <text x="474" y="222" font-size="16" font-weight="700" fill="#8A4937">NEW SITE</text><text x="474" y="250" font-size="15" fill="#17243A">site is the group</text>
    <rect x="655" y="105" width="245" height="327" rx="12" fill="#A35F47" stroke="#7D4232" stroke-width="3"/>
    <text x="680" y="140" font-size="16" font-weight="700" fill="#FFFFFF">ANOTHER REGION</text><text x="680" y="169" font-size="15" fill="#FFFFFF">independent regional evidence</text>
    <path d="M160 325 L350 255 L550 175 L775 90" fill="none" stroke="#2E6F95" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="58" y="483" font-size="17" fill="#17243A">Greater separation can reveal harder transfer — it does not make claims valid beyond the withheld domain</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2E6F95"/></marker></defs>
</svg>
